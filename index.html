/*
  Hollow Table, Mestre: interface v4 ("Luar").
  Princípios:
  1. A história é composta como livro (Literata); os controles, como painel de instrumentos (Atkinson).
  2. Luz é som: o que está tocando é a coisa mais clara da tela (lavanda da lua).
  3. Ciano é o olho do corvo: só aparece no que os jogadores veem.
  4. Uma superfície por função: na Mesa, só o console é painel; o roteiro fica direto sobre a noite.
  5. No iPad, nada importante fica fora da tela: som sempre à mão, marcadores sempre visíveis.
*/
:root {
  color-scheme: dark;
  --bg: #0F0D1C;
  --surface: #17142B;
  --surface-2: #211D3B;
  --fg: #ECE8F8;
  --muted: #A39DC6;
  --line: #2D2850;
  --accent: #7DE3FF;
  --accent-ink: #04161D;
  --accent-soft: #12303B;
  --active: #B9AEFF;
  --active-ink: #15112F;
  --hp: #F0808A;
  --fear: #E07CC4;
  --ok: #74DDA8;
  --stage: #07060E;
  --glow: rgba(185, 174, 255, 0.45);
  --glow-1: rgba(139, 123, 255, 0.14);
  --glow-2: rgba(125, 227, 255, 0.05);
  --font-read: 'Literata', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-ui: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-brand: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --console-w: 392px;
}

/* tons derivados (valem para todas as paletas) */
:root {
  --surface-3: color-mix(in srgb, var(--fg) 9%, var(--surface-2));
  --active-soft: color-mix(in srgb, var(--active) 17%, var(--surface-2));
  --active-line: color-mix(in srgb, var(--active) 60%, var(--line));
  --eye-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --hp-soft: color-mix(in srgb, var(--hp) 16%, var(--surface));
  --shade: rgba(4, 3, 10, 0.55);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.fear-v, .feed-list .fr, .num, .trk-num, .room-code, .scene-btn, .cd-pips { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: 0.4; }
a { color: var(--active); }
h1, h2, h3, p, figure, ul, ol { margin: 0; }
:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  background: var(--surface-2); color: var(--fg); border: 1px solid transparent;
  font-size: 15px; font-weight: 700; line-height: 1.15; text-decoration: none; white-space: nowrap;
  transition: background-color 0.12s, color 0.12s, border-color 0.12s;
}
.btn svg { width: 18px; height: 18px; }
.btn:hover { background: var(--surface-3); }
.btn:active { background: var(--active-soft); }
.btn.primary { background: var(--active); color: var(--active-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--active) 88%, var(--fg)); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--hp); }
.btn.danger-fill { background: var(--hp); color: #1A0508; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn.add { justify-self: start; }
.btn[aria-pressed="true"] { background: var(--active-soft); border-color: var(--active-line); color: var(--fg); }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px;
  color: var(--muted); transition: background-color 0.12s, color 0.12s;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 8px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.icon-btn.danger:hover { color: var(--hp); }
.linkbtn { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 36px; padding: 0 2px; }
.linkbtn:hover { color: var(--fg); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }

/* ---------- campos ---------- */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > label, .lbl { font-size: 14px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  transition: border-color 0.12s, background-color 0.12s;
}
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--active); background: color-mix(in srgb, var(--active) 5%, var(--surface)); }
textarea { resize: vertical; line-height: 1.5; min-height: 88px; }
textarea.auto { resize: none; overflow: hidden; }
select { appearance: auto; }
input[type="range"] { width: 100%; height: 32px; margin: 0; accent-color: var(--active); background: transparent; border: 0; padding: 0; }
.hint { color: var(--muted); font-size: 15px; max-width: 64ch; }
.empty-hint { color: var(--muted); font-size: 15px; padding: 18px 0; }

/* ---------- barra superior ---------- */
.bar {
  grid-row: 1;
  position: relative; z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: var(--gutter); padding-right: var(--gutter-r);
}
.bar-in { display: flex; align-items: center; gap: 8px 12px; min-height: 60px; }
.bar-l { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 2px; }
.bar-c { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 2px; }
.bar-r { flex: 1 1 0; min-width: max-content; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.adv-btn {
  display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%;
  min-height: 44px; padding: 0 10px 0 6px; border-radius: 10px;
  font-family: var(--font-read); font-weight: 600; font-size: 17px;
}
.adv-btn:hover { background: var(--surface-2); }
.adv-btn img { width: 30px; height: 30px; border-radius: 8px; flex: none; }
.adv-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adv-btn .caret, .scene-btn .caret { width: 16px; height: 16px; color: var(--muted); }
.scene-btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px;
  font-weight: 700; font-size: 15px; white-space: nowrap;
}
.scene-btn:hover { background: var(--surface-2); }
.scene-btn b { font-weight: 700; color: var(--muted); }
.modes { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.modes button { min-height: 36px; padding: 0 14px; border-radius: 9px; font-size: 15px; font-weight: 700; color: var(--muted); }
.modes button:hover { color: var(--fg); }
.modes button[aria-checked="true"] { background: var(--active); color: var(--active-ink); }
.save { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.save svg { width: 18px; height: 18px; }
.save[data-k="dirty"], .save[data-k="local"] { background: var(--active); color: var(--active-ink); }
.save[data-k="ok"] { color: var(--muted); }
.save[data-k="ok"] svg { color: var(--ok); }
.save[data-k="ok"]:hover { background: var(--surface-2); color: var(--fg); }
.save[data-k="busy"] { color: var(--muted); }
.save[data-k="warn"] { background: color-mix(in srgb, #FFB27A 18%, var(--surface-2)); color: #FFD2AE; }
.cloud { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; color: var(--muted); }
.cloud:hover { background: var(--surface-2); color: var(--fg); }
.cloud svg { width: 22px; height: 22px; }
.cloud svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cloud .prog { fill: none; stroke: var(--active); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0.55; transition: stroke-dashoffset 0.25s linear; }
.cloud[data-st="out"] .prog { display: none; }
.cloud::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 2px var(--bg); }
.cloud[data-st="ok"]::after { background: var(--ok); }
.cloud[data-st="busy"]::after { background: var(--active); animation: pulse 1s ease-in-out infinite; }
.cloud[data-st="off"]::after, .cloud[data-st="err"]::after, .cloud[data-st="conflict"]::after { background: #FFB27A; }
.cloud[data-st="out"]::after { display: none; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* menus suspensos */
.pop { position: fixed; z-index: 45; top: calc(env(safe-area-inset-top, 0px) + 64px); left: var(--gutter); }
.pop.pop-scenes { left: 50%; transform: translateX(-50%); }
.pop-panel {
  width: min(340px, calc(100vw - 32px)); max-height: min(70vh, 560px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
  box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7);
}
.pop-item { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 12px; width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 10px; text-align: left; }
.pop-item:hover { background: var(--surface-2); }
.pop-item > svg { width: 20px; height: 20px; color: var(--muted); }
.pop-item b { display: block; font-size: 16px; }
.pop-item small { display: block; color: var(--muted); font-size: 14px; line-height: 1.3; }
.pop-item[aria-current="true"] { background: var(--active-soft); }
.pop-item .num { width: 22px; text-align: right; color: var(--muted); font-weight: 700; }
.pop-item[aria-current="true"] .num { color: var(--active); }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-note { color: var(--muted); font-size: 14px; padding: 8px 12px 6px; overflow: hidden; text-overflow: ellipsis; }
.pop-scenes { list-style: none; padding: 0; display: grid; gap: 2px; }

/* ---------- área principal ---------- */
main.app { grid-row: 2; min-height: 0; overflow: hidden; position: relative; }

/* ---------- Mesa ---------- */
.mesa { display: grid; grid-template-columns: minmax(0, 1fr) var(--console-w); height: 100%; }
.roteiro { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--gutter) 48px; }
.roteiro-in { max-width: 46rem; margin: 0 auto; }
.scene-head { display: grid; gap: 10px; padding: 26px 0 6px; }
.scene-title { font-family: var(--font-read); font-weight: 600; font-size: clamp(28px, 3.2vw, 38px); line-height: 1.12; letter-spacing: -0.005em; text-wrap: balance; }
.scene-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; color: var(--muted); font-size: 15px; }
.kind { display: inline-flex; align-items: center; gap: 7px; color: var(--fg); font-weight: 700; }
.kind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--active); }
.kind[data-k="Combate"]::before { background: var(--hp); }
.kind[data-k="Clímax"]::before { background: var(--fear); }
.kind[data-k="Social"]::before { background: var(--ok); }
.kind[data-k="Investigação"]::before { background: #FFB27A; }
.scene-sum { font-family: var(--font-read); font-style: italic; font-size: 17px; line-height: 1.55; color: var(--muted); max-width: 62ch; }

.tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 2px; margin-top: 14px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 50px; padding: 0 14px; font-size: 16px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tab::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: transparent; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"]::after { background: var(--active); }
.tab .n { font-weight: 400; font-size: 14px; color: var(--muted); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tab-body { display: grid; gap: 0; padding-top: 8px; }

/* notas da cena (texto lido em voz alta) */
details.note { border-bottom: 1px solid var(--line); }
details.note summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 10px 0; cursor: pointer; font-family: var(--font-read); font-weight: 600; font-size: 21px; line-height: 1.25; }
details.note summary::-webkit-details-marker { display: none; }
details.note summary .caret { width: 20px; height: 20px; color: var(--muted); transition: transform 0.15s; }
details.note[open] summary .caret { transform: rotate(180deg); }
details.note summary:hover .caret { color: var(--fg); }
.rich { display: grid; gap: 12px; padding: 0 0 22px; font-family: var(--font-read); font-size: 19px; line-height: 1.6; max-width: 66ch; }
.rich ul { padding-left: 1.15em; display: grid; gap: 8px; }
.rich li::marker { color: var(--muted); }
.rich strong { font-weight: 700; color: var(--fg); }
.rich em { color: var(--fg); }
.callout { margin: 14px 0 6px; padding: 12px 16px; border-left: 3px solid var(--active); border-radius: 0 10px 10px 0; background: var(--active-soft); font-size: 16px; }

/* imagens */
.now { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; align-items: center; gap: 14px; margin: 14px 0 4px; padding: 10px; border-radius: 14px; background: var(--eye-soft); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.now img { width: 132px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 9px; display: block; }
.now-l { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 14px; font-weight: 700; }
.now-l svg { width: 16px; height: 16px; }
.now-c { font-family: var(--font-read); font-size: 18px; font-weight: 600; line-height: 1.3; }
.now-a { color: var(--muted); font-size: 14px; }
.now-none { margin: 14px 0 4px; padding: 14px 16px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 15px; }
.aud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 0 10px; }
.aud-l { color: var(--muted); font-size: 14px; font-weight: 700; margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid transparent; font-size: 14px; font-weight: 700; white-space: nowrap; }
.chip:hover { background: var(--surface-3); }
.chip[aria-pressed="true"], .chip[aria-current="true"] { background: var(--active-soft); border-color: var(--active-line); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px 14px; padding: 6px 0 10px; }
.shot { display: grid; gap: 6px; min-width: 0; }
.shot-b { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: var(--stage); outline-offset: 3px; }
.shot-b img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
.shot-b:hover img { transform: scale(1.02); }
.shot.on .shot-b { outline: 3px solid var(--accent); }
.shot-badge { position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.shot-badge svg { width: 14px; height: 14px; }
.shot figcaption { font-size: 14px; color: var(--muted); line-height: 1.35; }
.shot.on figcaption { color: var(--fg); }
details.room-box { margin-top: 12px; border-top: 1px solid var(--line); }
details.room-box summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 50px; cursor: pointer; color: var(--muted); font-size: 15px; font-weight: 700; }
details.room-box summary::-webkit-details-marker { display: none; }
details.room-box summary .caret { width: 18px; height: 18px; margin-left: auto; transition: transform 0.15s; }
details.room-box[open] summary .caret { transform: rotate(180deg); }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.room { display: grid; gap: 12px; padding: 4px 0 18px; justify-items: start; }
.room .field { width: 100%; }
.room-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%; }
.room-code { font-family: var(--font-read); font-size: 28px; font-weight: 600; letter-spacing: 0.16em; color: var(--accent); font-variant-numeric: lining-nums; }
.room-link { word-break: break-all; font-size: 14px; }

/* adversários */
.adv { display: grid; gap: 12px; margin-top: 16px; padding: 16px 18px; border-radius: 14px; background: var(--surface); min-width: 0; }
.adv header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.adv h3 { font-family: var(--font-read); font-weight: 600; font-size: 21px; }
.tag { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 700; }
.stats { color: var(--muted); font-size: 15px; }
.toks { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--active-line); background: var(--surface-2); font-weight: 700; }
.tok.down { border-color: var(--line); color: var(--muted); background: transparent; text-decoration: line-through; }
.gauge { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 10px; }
.gauge > span { font-size: 14px; font-weight: 700; color: var(--muted); }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pip { width: 34px; height: 34px; border-radius: 9px; border: 2px solid var(--line); background: transparent; }
.pip.on { background: var(--hp); border-color: var(--hp); }
.pip.stress.on { background: var(--active); border-color: var(--active); }
.feat { display: grid; gap: 6px; padding-left: 1.1em; font-size: 15px; color: var(--muted); }
.feat strong { color: var(--fg); }

/* jogadores (mesa online) na Mesa */
.jog-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 0 6px; }
.who-row { display: flex; flex-wrap: wrap; gap: 6px; }
.who-chip { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 700; }
.sub-h { font-size: 14px; font-weight: 700; color: var(--muted); padding: 14px 0 8px; }
.feed-list { list-style: none; padding: 0; display: grid; gap: 6px; }
.feed-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid transparent; }
.feed-list li.fresh { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.feed-list .fw { font-weight: 700; }
.feed-list .fw small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.feed-list .fe { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.feed-list .fr { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--font-read); font-size: 26px; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.feed-list .fr.good { color: var(--ok); } .feed-list .fr.bad { color: var(--hp); } .feed-list .fr.hot { color: #FFB27A; }
.feed-empty { color: var(--muted); background: transparent !important; border: 1px dashed var(--line) !important; }
.empty-cta { display: grid; gap: 14px; justify-items: start; padding: 22px 0; color: var(--muted); max-width: 52ch; }

/* console de som */
.console { overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-left: 1px solid var(--line); padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 24px; }
.c-sec { display: grid; gap: 10px; }
.c-sec > h2, .c-music > h2 { font-size: 14px; font-weight: 700; color: var(--muted); }
.c-empty { color: var(--muted); font-size: 14px; }
.c-music { display: grid; gap: 10px; }
.music { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 14px; }
.play { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--active); color: var(--active-ink); text-decoration: none; }
.play svg { width: 26px; height: 26px; }
.play .ic-play { margin-left: 3px; }
.play.off { background: var(--surface-2); color: var(--muted); }
.play:active { filter: brightness(0.9); }
.m-txt { display: grid; gap: 1px; min-width: 0; }
.m-name { font-weight: 700; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.m-terms { color: var(--muted); font-size: 14px; line-height: 1.35; }
.sp-msg { font-size: 14px; color: var(--fg); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
.sp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.sp-row strong { color: var(--fg); }
.sp-devs { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-vol { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.tracks { list-style: none; padding: 0; display: grid; gap: 2px; }
.trk { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 10px; border-radius: 9px; text-align: left; font-size: 15px; color: var(--muted); }
.trk:hover { background: var(--surface-2); color: var(--fg); }
.trk[aria-current="true"] { background: var(--active-soft); color: var(--fg); font-weight: 700; }
.trk-num { text-align: right; font-size: 13px; }
.combo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.ambs { display: grid; gap: 6px; }
.amb { display: grid; grid-template-columns: minmax(0, 1fr) minmax(88px, 42%); align-items: center; gap: 10px; }
.amb-t { display: flex; align-items: center; gap: 11px; min-height: 48px; padding: 0 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid transparent; text-align: left; font-size: 15px; font-weight: 700; line-height: 1.2; min-width: 0; transition: background-color 0.15s, border-color 0.15s; }
.amb-t .n { overflow: hidden; text-overflow: ellipsis; }
.amb-t:hover { background: var(--surface-3); }
.lamp { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); }
.amb-t[aria-pressed="true"] { background: var(--active-soft); border-color: var(--active-line); }
.amb-t[aria-pressed="true"] .lamp { background: var(--active); border-color: var(--active); box-shadow: 0 0 0 4px color-mix(in srgb, var(--active) 22%, transparent), 0 0 14px var(--active); animation: lamp 2.4s ease-in-out infinite; }
@keyframes lamp { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--active) 12%, transparent), 0 0 18px var(--active); } }
.amb-v { opacity: 0.55; transition: opacity 0.15s; }
.amb-t[aria-pressed="true"] + .amb-v, .amb-v:focus, .amb-v:hover { opacity: 1; }
.pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad { display: flex; align-items: flex-end; min-height: 68px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); text-align: left; font-size: 15px; font-weight: 700; line-height: 1.2; transition: background-color 0.1s, color 0.1s, transform 0.1s; }
.pad:hover { background: var(--surface-3); }
.pad.wide { grid-column: 1 / -1; min-height: 52px; align-items: center; }
.pad:active { transform: scale(0.97); }
.pad:active, .pad.playing { background: var(--active); color: var(--active-ink); }

/* ---------- barra inferior da Mesa ---------- */
.dock {
  grid-row: 3; position: relative; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px var(--gutter-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gutter);
}
.dock-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; min-height: 52px; }
.trk-g { display: flex; align-items: center; gap: 10px; }
.trk-n { font-size: 15px; font-weight: 700; color: var(--muted); }
.fear .trk-n { color: var(--fear); }
.rnd { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); font-size: 22px; line-height: 1; }
.rnd:hover { background: var(--surface-3); }
.fear-v { min-width: 2ch; text-align: center; font-family: var(--font-read); font-size: 26px; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.fear-pips { display: flex; gap: 4px; }
.fear-pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.fear-pips i.on { background: var(--fear); border-color: var(--fear); }
.cd-pips { display: flex; gap: 6px; }
.cd-pip { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--active-line); }
.cd-pip.on { background: var(--active); border-color: var(--active); }
.cd.done .trk-n { color: var(--active); }
.dock-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tgl[aria-pressed="true"] { background: var(--active); color: var(--active-ink); border-color: transparent; }
.vol { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); padding-left: 6px; }
.vol svg { width: 20px; height: 20px; }
.vol input { width: 150px; }

/* ---------- Preparar ---------- */
.prep { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }
.side { overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--line); padding: 18px 12px 32px max(12px, env(safe-area-inset-left, 0px)); display: grid; align-content: start; gap: 10px; background: color-mix(in srgb, var(--surface) 55%, var(--bg)); }
.side-h { font-size: 14px; font-weight: 700; color: var(--muted); padding: 0 10px; }
.scene-list { list-style: none; padding: 0; display: grid; gap: 2px; }
.scene-item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 8px; width: 100%; padding: 9px 10px; border-radius: 10px; text-align: left; min-height: 48px; align-content: center; }
.scene-item:hover { background: var(--surface-2); }
.scene-item .num { color: var(--muted); font-weight: 700; font-size: 15px; text-align: right; }
.scene-item .t { font-weight: 700; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.scene-item .k { grid-column: 2; color: var(--muted); font-size: 13px; line-height: 1.3; }
.scene-item[aria-current="true"] { background: var(--active-soft); }
.scene-item[aria-current="true"] .num { color: var(--active); }
.scene-tools { display: flex; gap: 2px; padding: 2px 0 6px 34px; }
.arm { display: grid; gap: 8px; margin: 2px 0 8px 34px; padding: 10px 12px; border-radius: 10px; background: var(--hp-soft); font-size: 14px; }
.arm .row { display: flex; gap: 6px; }
.add-scene { justify-content: flex-start; padding-left: 10px; }
.editor { overflow-y: auto; overscroll-behavior: contain; scroll-padding-top: 64px; }
.sec-nav { position: sticky; top: 0; z-index: 3; display: flex; gap: 2px; padding: 8px var(--gutter-r) 8px var(--gutter); background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.sec-nav-in { display: flex; gap: 2px; max-width: 46rem; width: 100%; margin: 0 auto; }
.sec-a { min-height: 36px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.sec-a:hover { background: var(--surface-2); color: var(--fg); }
.doc { max-width: 46rem; margin: 0 auto; padding: 28px var(--gutter-r) 160px var(--gutter); display: grid; gap: 48px; }
.sec { display: grid; gap: 16px; min-width: 0; scroll-margin-top: 64px; }
.sec-h { display: grid; gap: 4px; }
.sec h2 { font-family: var(--font-read); font-weight: 600; font-size: 25px; line-height: 1.2; }
.sec h3 { font-size: 16px; font-weight: 700; }
.sub-sec { display: grid; gap: 12px; padding-top: 10px; }
.title-input { font-family: var(--font-read); font-weight: 600; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.15; min-height: 0 !important; padding: 2px 0 8px !important; background: transparent !important; border: 0 !important; border-bottom: 1px solid transparent !important; border-radius: 0 !important; }
.title-input:hover { border-bottom-color: var(--line) !important; }
.title-input:focus { border-bottom-color: var(--active) !important; }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 14px; }
.facts-grid.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
textarea.read { font-family: var(--font-read); font-size: 18px; line-height: 1.6; padding: 12px 14px; }
.note-ed { display: grid; gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.note-ed:first-of-type { padding-top: 4px; }
.note-ed-h { display: flex; align-items: center; gap: 6px; }
.note-title, .trk-name, .combo-name { flex: 1; min-width: 0; font-family: var(--font-read); font-weight: 600; font-size: 20px; background: transparent !important; border: 0 !important; border-bottom: 1px solid transparent !important; border-radius: 0 !important; padding: 4px 0 !important; min-height: 40px !important; }
.note-title:hover, .trk-name:hover, .combo-name:hover { border-bottom-color: var(--line) !important; }
.note-title:focus, .trk-name:focus, .combo-name:focus { border-bottom-color: var(--active) !important; }
.mini-tools { display: flex; gap: 0; }
.trk-ed { display: grid; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--surface); }
.trk-ed-h { display: flex; align-items: center; gap: 10px; }
.trk-ed-h .num { color: var(--muted); font-weight: 700; width: 18px; text-align: right; }
.cues { display: grid; gap: 4px; }
.cue { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto 40px; align-items: center; gap: 4px 10px; min-height: 52px; padding: 4px; border-radius: 12px; background: var(--surface); }
.cue .n { font-weight: 700; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.cue-k { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.cue-k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--muted); }
.cue-k.amb::before { border-color: var(--active); background: var(--active); }
.cue-src { color: var(--muted); font-size: 13px; white-space: nowrap; }
.add-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.add-bar select, .add-bar input[type="text"] { width: auto; flex: 1 1 220px; }
details.basic { border-top: 1px solid var(--line); padding-top: 4px; }
details.basic summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; color: var(--muted); font-size: 15px; font-weight: 700; }
details.basic summary::-webkit-details-marker { display: none; }
details.basic summary .caret { width: 18px; height: 18px; transition: transform 0.15s; }
details.basic[open] summary .caret { transform: rotate(180deg); }
details.basic .add-bar { padding: 4px 0 8px; }
.combo-ed { display: grid; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--surface); }
.combo-ed-h { display: flex; align-items: center; gap: 8px; }
.combo-cues { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid transparent; font-size: 14px; font-weight: 700; cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--active); }
.chk:has(input:checked) { background: var(--active-soft); border-color: var(--active-line); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px 14px; }
.thumb { display: grid; gap: 8px; min-width: 0; }
.thumb-img { position: relative; }
.thumb-img img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; display: block; background: var(--stage); }
.thumb-img .icon-btn { position: absolute; top: 6px; right: 6px; background: var(--shade); color: #fff; }
.thumb-img .icon-btn:hover { background: var(--hp); color: #1A0508; }

      const ng = ctx.createGain(); ng.gain.value = normGain(b.buffer);
      b.connect(ng); ng.connect(fxBus);

    } else {
      LIB[c.id].play(t);
    }
    const btn = $('[data-action="fx"][data-id="' + c.id + '"]');

  function startAmb(c, level) {
    const out = ctx.createGain(), stops = [];

      const s = ctx.createBufferSource();
      s.buffer = fileBuffers[c.id]; s.loop = true;
      const ng = ctx.createGain(); ng.gain.value = normGain(s.buffer);
      s.connect(ng); ng.connect(out); s.start();
      stops.push(function () { s.stop(); });
    } else {
      LIB[c.id].build(out, stops);
    }
    const now = ctx.currentTime;
    out.gain.setValueAtTime(0.0001, now);
    out.gain.linearRampToValueAtTime(level, now + fadeSec());
    return { out: out, stops: stops };
  }

  const normCache = new WeakMap();
  function normGain(buf) {
    if (normCache.has(buf)) return normCache.get(buf);
    let sum = 0, n = 0, peak = 0;
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i += 3) { const v = d[i]; sum += v * v; n++; if (Math.abs(v) > peak) peak = Math.abs(v); }
    }
    const rms = Math.sqrt(sum / Math.max(1, n)) || 0.0001;
    let g = 0.2 / rms;
    g = Math.min(g, 1.6 / Math.max(peak, 0.0001));
    g = Math.max(0.5, Math.min(g, 12));
    normCache.set(buf, g);
    return g;
  }

      const im = new Image();

        const k = Math.min(1, max / Math.max(im.width, im.height));

    });
  }

    if (a === 'fear') { S.fear = Math.max(0, Math.min(12, S.fear + Number(el.getAttribute('data-d')))); save(); renderDock(); return; }

    if (a === 'palette') { if (id) document.documentElement.setAttribute('data-palette', id); else document.documentElement.removeAttribute('data-palette'); try { localStorage.setItem('cdm-palette', id); } catch (e) { /* sem armazenamento */ } render(); return; }
    if (a === 'tab') { tab = id; if (id === 'jog') feedUnseen = 0; render(); return; }
    if (a === 'hide') { unreveal(); render(); return; }
    if (a === 'aud') {

      else {
        audience = audience.filter(function (p) { return p !== 'todos'; });
        const at = audience.indexOf(id);
        if (at >= 0) audience.splice(at, 1); else audience.push(id);

    if (a === 'cueDel') { const gc = findCue(id); stopAmb(id); S.cues = S.cues.filter(function (c) { return c.id !== id; }); if (gc && gc.path && !gc.lib && !pathInUse(gc.path)) sbRemove(gc.path); delete fileBuffers[id]; commit(); return; }

    if (a === 'campRm') { if (campRm !== id) { campRm = id; render(); return; } campRemove(id); return; }

    if (a === 'advOpen') { dlg = { mode: 'list' }; renderDlg(); return; }
    if (a === 'advClose' || a === 'advCancel') { dlg = a === 'advCancel' ? { mode: 'list', home: dlg && dlg.home } : null; renderDlg(); return; }
    if (a === 'advPick') { dlg = null; renderDlg(); if (id !== A.id) advLoad(id); return; }

  });

  let libNameT = null;

  document.addEventListener('input', function (e) {

  document.addEventListener('change', function (e) {

      const parts = t.getAttribute('data-cbx').split('|'), cb = S.combos[Number(parts[0])];

      ROOM.players = t.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 12);

      if (!audience.length) audience = ['todos'];

      const f = t.files[0], kind = $('#new-kind').value;

        return new Promise(function (res, rej) { ctx.decodeAudioData(buf, res, rej); });
      }).then(function (ab) {
        const id = 'f' + Date.now();
        fileBuffers[id] = ab;
        const cue = { id: id, kind: kind, src: 'file', label: f.name.replace(/\.[^.]+$/, '') };

        toast(sbUser() ? 'Som adicionado. Enviando para a nuvem…' : 'Som adicionado (só neste aparelho; entre na Nuvem para guardá-lo).');

        sbAttach(cue, f, ext, f.type).then(function (ok) { if (sbUser()) toast(ok ? 'Som guardado na nuvem.' : 'Não consegui enviar o som para a nuvem.'); });
      }).catch(function () { toast('Não consegui ler este áudio. Tente mp3, m4a ou wav.'); });
      t.value = '';

    if (t.id === 'file-img' && t.files && t.files[0]) {

      }).catch(function () { toast('Não consegui abrir esta imagem.'); });
      t.value = '';
    }

  document.addEventListener('toggle', function (e) {

  ['dragenter', 'dragover'].forEach(function (ev) {

  });
  document.addEventListener('dragleave', function (e) { const z = e.target.closest && e.target.closest('#lib-drop'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag'); });
  document.addEventListener('drop', function (e) {
    const z = e.target.closest && e.target.closest('#lib-drop');

  /* ---------- início ---------- */
  (function () { try { const pl = localStorage.getItem('cdm-palette'); if (pl) document.documentElement.setAttribute('data-palette', pl); } catch (e) { /* sem armazenamento */ } })();
  setSession('ambient');
  renderScenes();
  render();
  sbInit();
  if (SP.enabled) spHandleCallback().then(render);
