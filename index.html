<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hollow Table">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root { color-scheme: light; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Hollow Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra fixa no topo (modo e cenas), Mesa em duas colunas (narrar à esquerda, ambientar à direita) e dock fixo embaixo com Medo e volume. */
:root {
  color-scheme: dark;
  --bg: #0A0912;
  --surface: #131122;
  --surface-2: #1B1830;
  --fg: #E9E6F7;
  --muted: #9D97BB;
  --line: #2B2745;
  --accent: #5EE1F5;
  --accent-ink: #031219;
  --accent-soft: #0E2B36;
  --active: #8B7BFF;
  --active-ink: #090719;
  --hp: #F27A86;
  --fear: #E474BE;
  --ok: #6EE0A8;
  --stage: #04030A;
  --glow: rgba(139, 123, 255, 0.55);
  --glow-1: rgba(139, 123, 255, 0.17);
  --glow-2: rgba(94, 225, 245, 0.07);
  --font-display: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #ECEAF5;
    --surface: #F9F8FD;
    --surface-2: #EFEDF8;
    --fg: #16132B;
    --muted: #5A5679;
    --line: #CDC9E3;
    --accent: #0A7288;
    --accent-ink: #F2FCFF;
    --accent-soft: #D3EEF4;
    --active: #5848D6;
    --active-ink: #FFFFFF;
    --hp: #B3303F;
    --fear: #A62F80;
    --ok: #1F7F52;
    --stage: #04030A;
    --glow: rgba(88, 72, 214, 0.35);
    --glow-1: rgba(88, 72, 214, 0.10);
    --glow-2: rgba(10, 114, 136, 0.06);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ECEAF5;
  --surface: #F9F8FD;
  --surface-2: #EFEDF8;
  --fg: #16132B;
  --muted: #5A5679;
  --line: #CDC9E3;
  --accent: #0A7288;
  --accent-ink: #F2FCFF;
  --accent-soft: #D3EEF4;
  --active: #5848D6;
  --active-ink: #FFFFFF;
  --hp: #B3303F;
  --fear: #A62F80;
  --ok: #1F7F52;
  --stage: #04030A;
  --glow: rgba(88, 72, 214, 0.35);
  --glow-1: rgba(88, 72, 214, 0.10);
  --glow-2: rgba(10, 114, 136, 0.06);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 0 56px;
}
body.has-dock { padding-block: 0 140px; }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--active);
  outline-offset: 2px;
}
h1, h2, h3, p, figure, ul { margin: 0; }
ul { padding-left: 1.2em; }

/* barra superior */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 24px; letter-spacing: 0.03em; }
input[type="email"], input[type="password"] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; color: var(--fg); font: inherit; }
input[type="email"]:focus-visible, input[type="password"]:focus-visible { outline: 2px solid var(--active); outline-offset: 1px; }
.top-r { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.cloud { display: inline-flex; align-items: center; justify-content: center; position: relative; flex: none; width: 46px; height: 46px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); cursor: pointer; }
.cloud svg { width: 22px; height: 22px; }
.cloud svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cloud .prog { fill: none; stroke: var(--active); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 0.25s linear; }
.cloud[data-st="out"] .prog { display: none; }
.cloud::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 2px var(--surface); }
.cloud[data-st="ok"] { color: var(--fg); }
.cloud[data-st="ok"]::after { background: var(--ok); }
.cloud[data-st="busy"]::after { background: var(--active); animation: pulse 1s ease-in-out infinite; }
.cloud[data-st="off"]::after, .cloud[data-st="err"]::after, .cloud[data-st="conflict"]::after { background: #ff9a6b; }
.cloud[data-st="out"]::after { display: none; }
@keyframes pulse { 50% { opacity: 0.25; } }
.gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(60% 50% at 50% 28%, var(--glow-1), transparent 70%), radial-gradient(50% 40% at 80% 90%, var(--glow-2), transparent 70%), var(--bg); overflow-y: auto; }
.gate[hidden] { display: none; }
.gate-card { width: min(380px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
.gate-logo { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 0 0 1px var(--line), 0 14px 50px var(--glow); }
.gate h1 { margin: 0; font-family: var(--font-display); font-size: 28px; letter-spacing: 0.06em; font-weight: 600; }
.gate .sub { margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.gate form { width: 100%; display: grid; gap: 14px; text-align: left; margin-top: 6px; }
.gate .btn.primary { width: 100%; min-height: 50px; font-weight: 700; letter-spacing: 0.02em; }
.gate .gate-err { min-height: 20px; margin: 0; color: var(--hp); font-size: 14px; text-align: center; }
.gate .skip { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }
.ver { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin-left: 4px; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.seg { display: grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 44px; padding: 0 22px; font-weight: 700; transition: background 0.12s, color 0.12s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--active); color: var(--active-ink); }
.scenes { max-width: 1180px; margin: 8px auto 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; min-height: 36px; font-size: 14px; white-space: nowrap; }
.chip[aria-current="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.chip:disabled { opacity: 0.55; }

/* conteúdo */
.wrap { max-width: 1180px; margin: 0 auto; padding-top: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
.head { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 5.2vw, 54px); line-height: 1.05; letter-spacing: 0.02em; text-wrap: balance; }
.lede { color: var(--muted); max-width: 66ch; font-size: 18px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); white-space: nowrap; }
.tag-hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cols { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 940px) { .cols { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 36px; } }
.col { display: grid; gap: 28px; min-width: 0; }
.panel { display: grid; gap: 12px; min-width: 0; border-top: 1px solid var(--line); padding-top: 14px; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: 0.03em; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 700; }
.hint { color: var(--muted); font-size: 15px; max-width: 62ch; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--fg); background: transparent; border-radius: 12px; padding: 8px 18px; min-height: 48px; font-weight: 700; text-decoration: none; color: var(--fg); transition: background 0.12s, color 0.12s; }
.btn:active { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--active); border-color: var(--active); color: var(--active-ink); }
.btn.quiet { border-color: var(--line); background: var(--surface); }
.btn.sm { min-height: 40px; padding: 4px 14px; font-size: 15px; }
.btn:disabled { opacity: 0.45; }

/* pips, fichas e marcadores */
.pips { display: flex; flex-wrap: wrap; gap: 8px; }
.pip { width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); padding: 0; }
.pip.on { background: var(--hp); border-color: var(--hp); }
.pip-lg { width: 52px; height: 52px; border-radius: 14px; }
.pip-lg.on { background: var(--accent); border-color: var(--accent); }
.pip.stress.on { background: var(--accent); border-color: var(--accent); }
.done { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.countdown .panel-h .btn { margin-left: auto; }

details.note { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.note + details.note { margin-top: 10px; }
details.note summary { list-style: none; padding: 14px 16px; min-height: 52px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
details.note summary::-webkit-details-marker { display: none; }
details.note summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); flex: none; margin-top: -4px; }
details.note[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.rich { padding: 0 16px 14px; display: grid; gap: 10px; max-width: 70ch; }
.rich ul { display: grid; gap: 6px; }

.adv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.adv + .adv { margin-top: 12px; }
.adv header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.stats { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.toks { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--fg); background: var(--surface-2); font-family: var(--font-mono); font-weight: 500; padding: 0; }
.tok.down { border-color: var(--line); color: var(--muted); background: transparent; }
.gauge { display: grid; grid-template-columns: 82px minmax(0, 1fr); align-items: center; gap: 10px; }
.gauge > span { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.feat { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
.feat strong { color: var(--fg); }

/* som */
.music { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.m-name { font-weight: 700; }
.m-terms { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.amb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.amb { display: grid; gap: 4px; min-width: 0; }
.amb-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 66px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; transition: background 0.12s, color 0.12s, border-color 0.12s; }
.amb-btn .n { font-weight: 700; line-height: 1.2; }
.amb-btn .st { font-family: var(--font-mono); font-size: 12px; opacity: 0.8; }
.amb-btn[aria-pressed="true"] { background: var(--active); color: var(--active-ink); border-color: var(--active); }
input[type="range"] { width: 100%; height: 36px; accent-color: var(--active); margin: 0; }
.fx-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .fx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fx { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 84px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; transition: background 0.12s, color 0.12s, border-color 0.12s; }
.fx.wide { grid-column: 1 / -1; min-height: 64px; }
.fx:active, .fx.playing { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fx .n { font-weight: 700; line-height: 1.2; }
.fx .m { font-family: var(--font-mono); font-size: 12px; opacity: 0.8; }

/* imagens e tela dos jogadores */
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--stage); display: grid; place-items: center; overflow: hidden; }
.stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stage .empty { color: #8FA19B; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.stage .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 10px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); color: #F2F4EF; font-size: 14px; }
.stage .hide { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.55); color: #F2F4EF; border-color: rgba(255, 255, 255, 0.4); }
.aud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.aud .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.aud .chip[aria-pressed="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); font-weight: 700; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); display: grid; min-width: 0; }
.shot.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.shot img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.shot figcaption { padding: 8px 12px 4px; font-size: 14px; }
.shot .btn { margin: 4px 10px 10px; }
.shot .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dock-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.fear { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fear-l { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.03em; color: var(--fear); }
.step { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--fg); background: transparent; font-size: 24px; line-height: 1; padding: 0; }
.step:active { background: var(--fg); color: var(--bg); }
.fear-v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); display: block; }
.dots i.on { background: var(--fear); border-color: var(--fear); }
.dock-vol { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 200px; max-width: 360px; }
.dock-vol span { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 15px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.15s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }

/* preparar */
.prep-grid { display: grid; gap: 28px; }
.adv-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 240px; border-color: var(--active); font-weight: 700; }
.adv-chip svg { width: 16px; height: 16px; flex: none; color: var(--active); }
.adv-chip span { overflow: hidden; text-overflow: ellipsis; }
.dlg-card { width: min(460px, 100%); text-align: left; justify-items: stretch; }
.dlg-card h1 { text-align: center; }
.adv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.adv-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; }
.adv-row.warn { border-color: var(--hp); }
.adv-row span { flex: 1 1 200px; min-width: 0; }
.adv-row input { flex: 1 1 160px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; color: var(--fg); font: inherit; }
.adv-pick { flex: 1 1 140px; min-width: 0; text-align: left; border: 0; background: none; font: inherit; font-weight: 600; padding: 6px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-up { border-style: dashed; }
.lib-up.drag { background: var(--accent-soft); }
.lib-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lib-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; }
.lib-play { flex: none; min-width: 40px; padding: 0; }
.lib-n { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lib-name { flex: 1 1 160px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; color: var(--fg); font: inherit; width: 100%; }
.lib-kind { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; min-height: 40px; color: var(--fg); font: inherit; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.lib-img { margin: 0; display: grid; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; align-content: start; }
.lib-img .th { aspect-ratio: 16 / 10; background: var(--stage); border-radius: 8px; overflow: hidden; display: grid; place-items: center; color: var(--muted); }
.lib-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-img figcaption { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-card { width: min(560px, 100%); }
.pick-body { max-height: 52vh; overflow-y: auto; padding-right: 2px; }
.adv-pick small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.adv-pick[aria-current="true"]::before { content: "● "; color: var(--active); }
.dlg-card form { display: grid; gap: 12px; margin-top: 4px; }
.ptabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.prep-grid[data-ptab="cena"] > [data-sec]:not([data-sec="cena"]) { display: none; }
.prep-grid[data-ptab="notas"] > [data-sec]:not([data-sec="notas"]) { display: none; }
.prep-grid[data-ptab="som"] > [data-sec]:not([data-sec="som"]) { display: none; }
.prep-grid[data-ptab="imagens"] > [data-sec]:not([data-sec="imagens"]) { display: none; }
.prep-grid[data-ptab="visual"] > [data-sec]:not([data-sec="visual"]) { display: none; }
.prep-grid[data-ptab="nuvem"] > [data-sec]:not([data-sec="nuvem"]) { display: none; }
.save-st { display: inline-flex; align-items: center; gap: 10px; min-width: 0; color: var(--muted); font-size: 15px; }
.save-st i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.save-st[data-k="ok"] i { background: var(--ok); }
.save-st[data-k="busy"] i { background: var(--active); animation: pulse 1s ease-in-out infinite; }
.save-st[data-k="dirty"] i, .save-st[data-k="warn"] i { background: #ff9a6b; }
.dock-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl-s { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
input[type="text"], textarea, select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.form-row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.edit-card { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.edit-card + .edit-card { margin-top: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cue-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.cue-row + .cue-row { margin-top: 8px; }
.cue-row .n { font-weight: 700; flex: 1 1 160px; min-width: 0; }
.add-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.add-row .field { flex: 1 1 200px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.thumb { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px; display: grid; gap: 8px; min-width: 0; }
.thumb img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; display: block; }


/* layout v2: título compacto, abas à esquerda, console de som fixo à direita */
h1 { font-size: clamp(30px, 4.2vw, 44px); }
.head { gap: 8px; }
.cols { gap: 24px; }
@media (min-width: 940px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; min-height: 48px; padding: 0 18px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-body { display: grid; gap: 12px; padding-top: 14px; min-width: 0; }
.tab-body .note + .note { margin-top: 0; }
.tab-body .adv + .adv { margin-top: 0; }
.console { display: grid; gap: 18px; min-width: 0; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
@media (min-width: 940px) {
  .console { position: sticky; top: calc(116px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 116px - 140px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; }
}
.console .music { background: transparent; border: 0; padding: 0; flex-wrap: nowrap; justify-content: flex-start; gap: 14px; }
.play { border: 0; padding: 0; flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--active); color: var(--active-ink); display: grid; place-items: center; text-decoration: none; }
.play svg { width: 30px; height: 30px; margin-left: 3px; }
.play:active { filter: brightness(0.85); }
.m-txt { min-width: 0; display: grid; gap: 2px; }
.lbl-s { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sub { display: grid; gap: 8px; }
.sub h2 { font-size: 20px; }
.amb-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(0, 1.2fr); align-items: center; gap: 10px; }
.console .amb-btn { flex-direction: row; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; background: var(--surface-2); }
.console .amb-btn[aria-pressed="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.amb-btn[aria-pressed="true"] .dot { background: var(--active-ink); border-color: var(--active-ink); }
.console .fx { min-height: 62px; padding: 10px; background: var(--surface-2); }
.console .fx.wide { min-height: 52px; flex-direction: row; align-items: center; }
.console .fx:active, .console .fx.playing { background: var(--accent); }
@media (max-width: 520px) { .amb-row { grid-template-columns: 1fr; } }

.sp-dev { font-size: 14px; color: var(--muted); }
.sp-vol { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 6px; }
.sp-vol span { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.sp-msg { font-size: 14px; margin-top: 4px; }
.linkbtn { border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 8px 0; min-height: 40px; justify-self: start; font-size: 14px; }

/* identidade v3: arcano e moderno (violeta e ciano sobre quase-preto) */
body {
  background: radial-gradient(1100px 520px at 12% -8%, var(--glow-1), transparent 62%), radial-gradient(900px 460px at 100% 0%, var(--glow-2), transparent 58%), var(--bg);
  background-attachment: fixed;
}
h1 { font-weight: 600; letter-spacing: 0.05em; }
h2 { font-size: 19px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.brand { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.brand svg { color: var(--active); filter: drop-shadow(0 0 8px var(--glow)); }
.fear-l { font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 18px; }
.top { background: var(--bg); background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 14px 30px -22px var(--glow); }
.dock { background: var(--surface); background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 -14px 30px -24px var(--glow); }
.panel { border-top: 0; position: relative; padding-top: 18px; }
.panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, var(--active), var(--line) 38%, transparent); }
.console, .adv, details.note, .edit-card, .shot, .thumb, .cue-row { box-shadow: 0 16px 34px -26px rgba(0, 0, 0, 0.9); }
.chip[aria-current="true"] { background: var(--active); color: var(--active-ink); border-color: var(--active); box-shadow: 0 0 18px -4px var(--glow); }
.tab[aria-selected="true"] { border-bottom-color: var(--active); }
.seg button[aria-checked="true"], .btn.primary, .amb-btn[aria-pressed="true"], .console .amb-btn[aria-pressed="true"] { box-shadow: 0 0 22px -6px var(--glow); }
.play { box-shadow: 0 0 0 4px var(--glow-1), 0 0 26px -2px var(--glow); }
.pip.on { box-shadow: 0 0 14px -3px var(--hp); }
.pip-lg.on, .pip.stress.on { box-shadow: 0 0 16px -3px var(--accent); }
.dots i.on { box-shadow: 0 0 9px var(--fear); }
.tag-hot { box-shadow: 0 0 16px -6px var(--accent); }
.fx:active, .fx.playing, .console .fx:active, .console .fx.playing { box-shadow: 0 0 22px -4px var(--accent); }
.shot.on { box-shadow: 0 0 0 2px var(--accent), 0 0 24px -6px var(--accent); }
.done { box-shadow: 0 0 24px -10px var(--accent); }

  function buildRain(out, stops) {

    bp.type = 'bandpass'; bp.Q.value = 0.9; bp.frequency.value = 450;
    lfo.frequency.value = 0.13; lg.gain.value = 280;
    lfo.connect(lg); lg.connect(bp.frequency);
    ag.gain.value = 0.65;
    lfo2.frequency.value = 0.21; lg2.gain.value = 0.35;
    lfo2.connect(lg2); lg2.connect(ag.gain);

  function buildCanal(out, stops) {
    const s = noise(true), bp = ctx.createBiquadFilter(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.value = 320;
    lfo.frequency.value = 0.17; lg.gain.value = 120;
    lfo.connect(lg); lg.connect(bp.frequency);
    s.connect(bp); bp.connect(out);
    s.start(); lfo.start();
    let alive = true, timer = null;
    const plop = function () {
      if (!alive) return;
      const t = ctx.currentTime, f = 500 + Math.random() * 700;
      const o = ctx.createOscillator(), g = ctx.createGain();

      o.frequency.setValueAtTime(f, t);

      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.1);
      timer = setTimeout(plop, 300 + Math.random() * 1800);

    plop();
    stops.push(function () { alive = false; clearTimeout(timer); s.stop(); lfo.stop(); });

  function buildMill(out, stops) {

    s.connect(lp); lp.connect(g0); g0.connect(out);
    s.start();
    let alive = true, timer = null;
    const turn = function () {
      if (!alive) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(70, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.2);
      env(g, t, 0.5, 0.02, 0.33);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.4);
      const c = noise(false), bp = ctx.createBiquadFilter(), cg = ctx.createGain();
      bp.type = 'bandpass'; bp.Q.value = 6;

      cg.gain.setValueAtTime(0.0001, t);
      cg.gain.linearRampToValueAtTime(0.18, t + 0.1);
      cg.gain.linearRampToValueAtTime(0.0001, t + 0.55);

      c.start(t, Math.random() * 1.5, 0.6);

  /* nivela o volume de arquivos para ficar perto dos sons sintetizados */
  const normCache = new WeakMap();
  function normGain(buf) {
    if (normCache.has(buf)) return normCache.get(buf);
    let sum = 0, n = 0, peak = 0;
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i += 3) { const v = d[i]; sum += v * v; n++; if (Math.abs(v) > peak) peak = Math.abs(v); }
    }
    const rms = Math.sqrt(sum / Math.max(1, n)) || 0.0001;
    let g = 0.2 / rms;
    g = Math.min(g, 1.6 / Math.max(peak, 0.0001));
    g = Math.max(0.5, Math.min(g, 12));
    normCache.set(buf, g);
    return g;
  }

    if (a === 'noteDown' && i < S.notes.length - 1) { const n = S.notes.splice(i, 1)[0]; S.notes.splice(i + 1, 0, n); commit(); return; }
    if (a === 'libTab') { libTab = id; libQ = ''; libDelArm = null; if (libPick) libPick.type = id; render(); return; }
    if (a === 'fsPlay') { fsPreview(id); return; }
    if (a === 'fsSave') { fsSave(id); return; }
    if (a === 'fsKeyClear') { fsKey = ''; fsRes = null; lsSet(FS_KEY, ''); render(); return; }
    if (a === 'libPlay') { libPreview(id); return; }
    if (a === 'libUse') { if (libPick && libPick.type === 'img') addLibImage(id); else addLibSound(id); renderPicker(); return; }
    if (a === 'libDel') {
      if (libDelArm !== id) { libDelArm = id; render(); toast(libUsage(id) ? 'Usado em ' + libUsage(id) + ' cena(s). Toque de novo para excluir mesmo assim.' : 'Toque de novo para excluir.'); return; }
      libDelArm = null; libDelete(id); render(); return;
    }
    if (a === 'libOpen') { libPick = { type: id }; libQ = ''; renderPicker(); return; }
    if (a === 'libClose') { libPick = null; libStop(); renderPicker(); render(); return; }
    if (a === 'cueTest') {
      const c = findCue(id);
      if (c.kind === 'fx') playFx(c);
      else if (!active[id]) { toggleAmb(id); setTimeout(function () { stopAmb(id); }, 4000); }
      return;
    }
    if (a === 'cueDel') { const gc = findCue(id); stopAmb(id); S.cues = S.cues.filter(function (c) { return c.id !== id; }); if (gc && gc.path && !gc.lib && !pathInUse(gc.path)) sbRemove(gc.path); delete fileBuffers[id]; commit(); return; }
    if (a === 'cueAdd') {
      const k = $('#add-lib').value;
      if (k && LIB[k]) { S.cues.push({ id: k, kind: LIB[k].kind, src: 'synth' }); commit(); }
      return;
    }
    if (a !== 'sceneDel') armDel = false;
    if (a === 'ptab') { ptab = id; render(); return; }
    if (a === 'scene') { setScene(i); return; }
    if (a === 'sceneAdd') { sceneAdd(); return; }
    if (a === 'sceneDup') { sceneDup(); toast('Cena duplicada.'); return; }
    if (a === 'sceneLeft') { sceneMove(-1); return; }
    if (a === 'sceneRight') { sceneMove(1); return; }
    if (a === 'sceneDel') { if (!armDel) { armDel = true; render(); return; } sceneDel(); toast('Cena excluída.'); return; }
    if (a === 'sceneDelNo') { armDel = false; render(); return; }
    if (a === 'cdAdd') { S.countdown = { name: 'Contagem', max: 3, value: 0, cue: '', done: '' }; commit(); return; }
    if (a === 'cdDel') { S.countdown = null; commit(); return; }
    if (a === 'advOpen') { dlg = { mode: 'list' }; renderDlg(); return; }
    if (a === 'advClose' || a === 'advCancel') { dlg = a === 'advCancel' ? { mode: 'list', home: dlg && dlg.home } : null; renderDlg(); return; }
    if (a === 'advPick') { dlg = null; renderDlg(); if (id !== A.id) advLoad(id); return; }
    if (a === 'advRename') { dlg = { mode: 'rename', id: id, home: dlg && dlg.home }; renderDlg(); return; }
    if (a === 'advRenameOk') { const f = $('#adv-rn'); if (f) advRename(id, f.value); dlg = { mode: 'list', home: dlg && dlg.home }; renderDlg(); return; }
    if (a === 'advDel') { dlg = { mode: 'del', id: id, home: dlg && dlg.home }; renderDlg(); return; }
    if (a === 'advDelOk') { const hm = dlg && dlg.home; dlg = { mode: 'list', home: hm }; advDelete(id); renderDlg(); return; }
    if (a === 'saveNow') {
      saveLocal();
      if (!sbUser()) { toast('Salvo neste aparelho. Entre na Nuvem para abrir no iPad.'); return; }
      clearTimeout(sbTimer);
      sbSync(true).then(function () { toast(sbState === 'ok' ? 'Salvo na nuvem.' : 'Não consegui salvar na nuvem.'); });
      return;
    }
    if (a === 'cloud') { if (!sbUser()) { showGate(); return; } if (sbState !== 'conflict') sbSync(); mode = 'prep'; ptab = 'nuvem'; render(); window.scrollTo(0, 0); return; }
    if (a === 'gateOpen') { showGate(); return; }
    if (a === 'gateSkip') { try { sessionStorage.setItem('cdm-skip', '1'); } catch (e) { /* ok */ } hideGate(); showLobby(); return; }
    if (a === 'sbOut') { try { localStorage.removeItem('cdm-sb'); localStorage.removeItem('cdm-sbmeta'); } catch (e) { /* ok */ } sbConflict = null; setSb('out'); render(); return; }
    if (a === 'sbSync') { sbSync(); return; }
    if (a === 'sbExport') { sbExport(); return; }
    if (a === 'sbCloud') { sbResolve(true); return; }
    if (a === 'sbLocal') { sbResolve(false); return; }
    if (a === 'imgDel') { const gone = S.images.filter(function (im) { return im.id === id; })[0]; S.images = S.images.filter(function (im) { return im.id !== id; }); if (gone && gone.path && !gone.lib && !pathInUse(gone.path)) sbRemove(gone.path); if (revealed === id) revealed = null; commit(); return; }
  });

  let libNameT = null;
  document.addEventListener('submit', function (e) {
    const f = e.target;
    if (f.id === 'fs-keyform') { e.preventDefault(); const v = $('#fs-key').value.trim(); if (v) { fsKey = v; lsSet(FS_KEY, v); render(); } return; }
    if (f.id === 'fs-form') { e.preventDefault(); fsSearch(); }
  });
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'fs-q') { fsQ = t.value; return; }
    if (t.id === 'lib-q') { libQ = t.value; if (libPick) { const b = $('.pick-body'); if (b) b.innerHTML = libRows(true); } else { const keep = t.selectionStart; render(); } return; }
    if (t.getAttribute && t.getAttribute('data-libname')) {
      const it = libFind(t.getAttribute('data-libname'));
      if (it) { it.name = t.value; clearTimeout(libNameT); libNameT = setTimeout(libSave, 700); }
      return;
    }
    if (t.tagName === 'SELECT') return;
    if (t.id === 'sp-vol') { spVol = Number(t.value); return; }
    if (t.getAttribute('data-bind')) {
      setPath(S, t.getAttribute('data-bind'), t.value);
      if (t.getAttribute('data-bind') === 'title') renderScenes();
      save();
      return;
    }
    if (t.id === 'vol-master') {
      S.vol = parseFloat(t.value);
      if (master) rampTo(master.gain, posToGain(S.vol, 1.5), 0.03);
      save();
      return;
    }
    if (t.getAttribute('data-vol')) {
      const id = t.getAttribute('data-vol'), c = findCue(id);
      levels[id] = parseFloat(t.value);
      if (active[id] && c) rampTo(active[id].out.gain, posToGain(levels[id], 1.2) * ambK(c), 0.05);
    }
  });

  document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.id === 'fs-len') { fsLen = t.value; return; }
    if (t.id === 'fade-sel') { lsSet('ht-fade', t.value); return; }
    if (t.getAttribute && t.getAttribute('data-libkind')) { const it = libFind(t.getAttribute('data-libkind')); if (it) { it.kind = t.value; libSave(); } return; }
    if (t.id === 'lib-file' && t.files && t.files.length) { libAddMany(t.files, libTab === 'img' ? 'img' : 'snd', false); t.value = ''; return; }
    if (t.id === 'sp-vol') { spVol = Number(t.value); spSetVol(spVol); return; }
    if (t.tagName === 'SELECT' && t.getAttribute('data-bind')) {
      const p = t.getAttribute('data-bind');
      setPath(S, p, p === 'countdown.max' ? Number(t.value) : t.value);
      if (p === 'countdown.max') S.countdown.value = Math.min(S.countdown.value, S.countdown.max);
      commit();
      return;
    }
    if (t.id === 'file-restore' && t.files && t.files[0]) {
      t.files[0].text().then(function (tx) {
        const j = JSON.parse(tx);
        restoreBackup(j); toast('Backup restaurado.');
      }).catch(function () { toast('Este arquivo não parece um backup do Hollow Table.'); });
      t.value = '';
      return;
    }
    if (t.id === 'file-audio' && t.files && t.files.length && sbUser()) {
      libAddMany(t.files, 'snd', true);
      t.value = '';
      return;
    }
    if (t.id === 'file-img' && t.files && t.files.length && sbUser()) { libAddMany(t.files, 'img', true); t.value = ''; return; }
    if (t.id === 'file-audio' && t.files && t.files[0]) {
      const f = t.files[0], kind = $('#new-kind').value;
      ensure();
      f.arrayBuffer().then(function (buf) {
        return new Promise(function (res, rej) { ctx.decodeAudioData(buf, res, rej); });
      }).then(function (ab) {
        const id = 'f' + Date.now();
        fileBuffers[id] = ab;
        const cue = { id: id, kind: kind, src: 'file', label: f.name.replace(/\.[^.]+$/, '') };
        S.cues.push(cue);
        commit();
        toast(sbUser() ? 'Som adicionado. Enviando para a nuvem…' : 'Som adicionado (só neste aparelho; entre na Nuvem para guardá-lo).');
        const ext = (f.name.match(/\.([A-Za-z0-9]+)$/) || [0, 'mp3'])[1].toLowerCase();
        sbAttach(cue, f, ext, f.type).then(function (ok) { if (sbUser()) toast(ok ? 'Som guardado na nuvem.' : 'Não consegui enviar o som para a nuvem.'); });
      }).catch(function () { toast('Não consegui ler este áudio. Tente mp3, m4a ou wav.'); });
      t.value = '';
      return;
    }
    if (t.id === 'file-img' && t.files && t.files[0]) {
      const f = t.files[0];
      readFile(f).then(function (u) { return downscale(u, 1280); }).then(function (u) {
        if (!u) { toast('Não consegui abrir esta imagem.'); return; }
        const im = { id: 'u' + Date.now(), caption: f.name.replace(/\.[^.]+$/, ''), src: u };
        S.images.push(im);
        commit();
        toast(sbUser() ? 'Imagem adicionada. Enviando para a nuvem…' : 'Imagem adicionada (só neste aparelho; entre na Nuvem para guardá-la).');
        fetch(u).then(function (r) { return r.blob(); }).then(function (bl) { return sbAttach(im, bl, 'jpg', 'image/jpeg'); }).then(function (ok) { if (sbUser()) toast(ok ? 'Imagem guardada na nuvem.' : 'Não consegui enviar a imagem para a nuvem.'); });
      }).catch(function () { toast('Não consegui abrir esta imagem.'); });
      t.value = '';
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && mode === 'prep') { e.preventDefault(); const b = $('[data-action="saveNow"]'); if (b) b.click(); }
  });

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'adv-new') {
      e.preventDefault();
      const f = $('#adv-nn');
      dlg = null; renderDlg(); advCreate(f ? f.value : '');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'adv-rn') { e.preventDefault(); const b = $('[data-action="advRenameOk"]'); if (b) b.click(); }
    if (e.key === 'Escape' && libPick) { libPick = null; libStop(); renderPicker(); render(); }
    else if (e.key === 'Escape' && dlg) { dlg = null; renderDlg(); }
  });

  document.addEventListener('toggle', function (e) {
    const d = e.target;
    if (d && d.matches && d.matches('details.note')) {
      const n = S.notes[Number(d.getAttribute('data-note'))];
      if (n && n.open !== d.open) { n.open = d.open; save(); }
    }
  }, true);

  /* ---------- início ---------- */
  (function () { try { const pl = localStorage.getItem('cdm-palette'); if (pl) document.documentElement.setAttribute('data-palette', pl); } catch (e) { /* sem armazenamento */ } })();
  setSession('ambient');
  renderScenes();
  render();
  sbInit();
  if (SP.enabled) spHandleCallback().then(render);
})();
</script>
</body>
</html>
