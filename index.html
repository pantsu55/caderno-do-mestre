  A organização nova (Mesa em tela cheia, Preparar como documento, menu para Biblioteca,

  violeta e ciano sobre quase-preto, brilhos e cartões com borda.
*/
:root {
  color-scheme: dark;
  --bg: #0A0912;
  --surface: #131122;
  --surface-2: #1B1830;
  --fg: #E9E6F7;
  --muted: #9D97BB;
  --line: #2B2745;
  --accent: #5EE1F5;
  --accent-ink: #031219;
  --accent-soft: #0E2B36;
  --active: #8B7BFF;
  --active-ink: #090719;
  --hp: #F27A86;
  --fear: #E474BE;
  --ok: #6EE0A8;
  --stage: #04030A;
  --glow: rgba(139, 123, 255, 0.55);
  --glow-1: rgba(139, 123, 255, 0.17);
  --glow-2: rgba(94, 225, 245, 0.07);
  --font-display: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --console-w: 404px;
  --wide: 1240px;
}

/* tons derivados (valem para todas as paletas) */
:root {
  --surface-3: color-mix(in srgb, var(--fg) 8%, var(--surface-2));
  --active-soft: color-mix(in srgb, var(--active) 20%, var(--surface-2));
  --active-line: color-mix(in srgb, var(--active) 65%, var(--line));
  --hp-soft: color-mix(in srgb, var(--hp) 16%, var(--surface));
  --shade: rgba(4, 3, 10, 0.6);
  --card-shadow: 0 16px 34px -26px rgba(0, 0, 0, 0.9);
  --crit: #F5C66B;
  --warn-c: #FFB86B;
}
:root[data-palette="pergaminho"] { --crit: #A36A00; --warn-c: #B45A12; }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  background: radial-gradient(1100px 520px at 12% -8%, var(--glow-1), transparent 62%), radial-gradient(900px 460px at 100% 0%, var(--glow-2), transparent 58%), var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: 0.45; }
a { color: var(--accent); }
h1, h2, h3, p, figure, ul, ol { margin: 0; }
:focus-visible { outline: 3px solid var(--active); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }
.fear-v, .num, .trk-num, .cd-pips, .feed-list .fr { font-variant-numeric: tabular-nums; }

/* tipografia da identidade */
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lbl-s, .field > label, .lbl { font-family: var(--font-mono); font-size: 12px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cap-h { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--fg); background: transparent; color: var(--fg);
  font-size: 15px; font-weight: 700; line-height: 1.15; text-decoration: none; white-space: nowrap;
  transition: background-color 0.12s, color 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.btn svg { width: 18px; height: 18px; }
.btn:active { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 22px -6px var(--glow); }
.btn.primary:active { filter: brightness(0.9); }
.btn.quiet { background: var(--surface); border-color: var(--line); }
.btn.quiet:hover { border-color: var(--muted); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface); }
.btn.danger { color: var(--hp); border-color: color-mix(in srgb, var(--hp) 50%, var(--line)); background: transparent; }
.btn.danger-fill { background: var(--hp); border-color: var(--hp); color: #1A0508; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.add { justify-self: start; }
.btn[aria-pressed="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 22px -6px var(--glow); }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px;
  color: var(--muted); transition: background-color 0.12s, color 0.12s;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 9px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.icon-btn.danger:hover { color: var(--hp); }
.sq-btn { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); flex: none; }
.sq-btn:hover { color: var(--fg); border-color: var(--muted); }
.sq-btn svg { width: 22px; height: 22px; }
.linkbtn { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 36px; padding: 0 2px; }
.linkbtn:hover { color: var(--fg); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }

/* ---------- campos ---------- */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  transition: border-color 0.12s, box-shadow 0.12s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--active); box-shadow: 0 0 0 3px color-mix(in srgb, var(--active) 22%, transparent); }
textarea { resize: vertical; line-height: 1.5; min-height: 96px; }
textarea.auto { resize: none; overflow: hidden; }
select { appearance: auto; }
input[type="range"] { width: 100%; height: 34px; margin: 0; accent-color: var(--active); background: transparent; border: 0; padding: 0; }
.hint { color: var(--muted); font-size: 15px; max-width: 64ch; }
.empty-hint { color: var(--muted); font-size: 15px; padding: 14px 0; }

/* ---------- barra superior ---------- */
.bar {
  grid-row: 1; position: relative; z-index: 30;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 14px 30px -22px var(--glow);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: var(--gutter); padding-right: var(--gutter-r);
}
.bar-in { max-width: var(--wide); margin: 0 auto; display: flex; align-items: center; gap: 10px 14px; min-height: 68px; }
.bar-l { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
.bar-c { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 4px; }
.bar-r { flex: 1 1 0; min-width: max-content; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; color: var(--active); filter: drop-shadow(0 0 8px var(--glow)); }
.ver { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.adv-btn {
  display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 260px;
  min-height: 38px; padding: 0 12px 0 14px; border-radius: 999px;
  border: 1px solid var(--active); background: var(--surface);
  font-size: 14px; font-weight: 700;
}
.adv-btn:hover { box-shadow: 0 0 18px -6px var(--glow); }
.adv-btn > svg:first-child { width: 16px; height: 16px; color: var(--active); }
.adv-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adv-btn .caret, .scene-btn .caret { width: 15px; height: 15px; color: var(--muted); }
.scene-btn {
  display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 300px;
  min-height: 38px; padding: 0 12px 0 14px; border-radius: 999px;
  background: var(--active); color: var(--active-ink); box-shadow: 0 0 18px -4px var(--glow);
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.scene-btn span { overflow: hidden; text-overflow: ellipsis; }
.scene-btn .caret { color: var(--active-ink); opacity: 0.7; }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 44px; padding: 0 20px; font-weight: 700; transition: background 0.12s, color 0.12s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--active); color: var(--active-ink); box-shadow: 0 0 22px -6px var(--glow); }
.save { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 15px; font-weight: 700; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
.save svg { width: 18px; height: 18px; }
.save[data-k="dirty"], .save[data-k="local"] { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 22px -6px var(--glow); }
.save[data-k="ok"] { color: var(--muted); }
.save[data-k="ok"] svg { color: var(--ok); }
.save[data-k="busy"] { color: var(--muted); }
.save[data-k="warn"] { border-color: #ff9a6b; color: #ffc3a5; }
.cloud { position: relative; isolation: isolate; display: inline-grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 12px; background: var(--line); color: var(--muted); transition: background 0.3s, box-shadow 0.6s, color 0.3s; }
.cloud:hover { background: color-mix(in srgb, var(--muted) 55%, var(--line)); }
.cloud .face { position: absolute; z-index: 1; inset: 1.5px; border-radius: 10.5px; background: var(--surface); }
.cloud > svg { position: relative; z-index: 3; width: 22px; height: 22px; }
.cloud .dot { position: absolute; z-index: 4; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 2px var(--surface); transition: background 0.4s, box-shadow 0.4s; }
/* rastro: um traço que corre pela própria borda, sempre com o mesmo tamanho e a mesma velocidade;
   lento quando está tudo salvo, rápido ao sincronizar. Só a opacidade troca, então nunca há tranco */
.cloud > svg.trail { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; fill: none; stroke-width: 1.6; pointer-events: none; overflow: hidden; }
.cloud .trail g { opacity: 0; transition: opacity 0.8s ease; }
.cloud .trail path { stroke: var(--active); animation: cloud-run 14s linear var(--ps, 0s) infinite; }
.cloud .trail .fast path { animation: cloud-run 1.25s linear var(--pf, 0s) infinite; }
.cloud .trail .fast path.h { stroke: var(--accent); }
.cloud[data-st="out"] .dot { display: none; }
.cloud[data-st="ok"] { color: var(--fg); }
.cloud[data-st="ok"] .dot { background: var(--ok); }
.cloud[data-st="ok"] .trail .slow { opacity: 0.9; }
.cloud[data-st="busy"] { color: var(--fg); box-shadow: 0 0 16px -5px var(--active); }
.cloud[data-st="busy"] .trail .fast { opacity: 1; }
.cloud[data-st="busy"] .dot { background: var(--active); box-shadow: 0 0 0 2px var(--surface), 0 0 8px var(--active); }
.cloud[data-st="off"], .cloud[data-st="err"], .cloud[data-st="conflict"] { color: #ffb48f; }
.cloud[data-st="off"] .dot, .cloud[data-st="err"] .dot, .cloud[data-st="conflict"] .dot { background: #ff9a6b; }
.cloud[data-st="conflict"] .dot { animation: cloud-dot 1.4s ease-in-out infinite; }
.cloud.flash { box-shadow: 0 0 0 1px var(--ok), 0 0 18px -4px var(--ok); }
.cloud.flash .dot { box-shadow: 0 0 0 2px var(--surface), 0 0 10px var(--ok); }
@keyframes cloud-run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -158.372; } }
@keyframes cloud-dot { 50% { opacity: 0.35; } }
@keyframes pulse { 50% { opacity: 0.25; } }

/* menus suspensos */
.pop { position: fixed; z-index: 45; top: calc(env(safe-area-inset-top, 0px) + 74px); left: max(var(--gutter), calc((100vw - var(--wide)) / 2)); }
.pop.pop-scenes { left: 50%; transform: translateX(-50%); }
.pop-panel {
  width: min(360px, calc(100vw - 32px)); max-height: min(70vh, 560px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
  box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.75), 0 0 40px -18px var(--glow);
}
.pop-item { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 12px; width: 100%; min-height: 50px; padding: 8px 12px; border-radius: 10px; text-align: left; }
.pop-item:hover { background: var(--surface-2); }
.pop-item > svg { width: 20px; height: 20px; color: var(--active); }
.pop-item b { display: block; font-size: 16px; }
.pop-item small { display: block; color: var(--muted); font-size: 14px; line-height: 1.3; }
.pop-item[aria-current="true"] { background: var(--active); color: var(--active-ink); box-shadow: 0 0 18px -6px var(--glow); }
.pop-item[aria-current="true"] small { color: var(--active-ink); opacity: 0.75; }
.pop-item .num { width: 22px; text-align: right; color: var(--muted); font-family: var(--font-mono); font-size: 14px; }
.pop-item[aria-current="true"] .num { color: var(--active-ink); }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-note { color: var(--muted); font-size: 14px; padding: 6px 12px; overflow: hidden; text-overflow: ellipsis; }
.pop-scenes { list-style: none; padding: 0; display: grid; gap: 2px; }

/* ---------- área principal ---------- */
main.app { grid-row: 2; min-height: 0; overflow: hidden; position: relative; }

/* ---------- Mesa ---------- */
.mesa { display: grid; grid-template-columns: minmax(0, 1fr) var(--console-w); gap: 24px; height: 100%; max-width: var(--wide); margin: 0 auto; padding: 0 var(--gutter-r) 0 var(--gutter); }
.roteiro { overflow-y: auto; overscroll-behavior: contain; padding: 0 2px 40px; min-width: 0; }
.roteiro-in { max-width: 48rem; }
.scene-head { display: grid; gap: 10px; padding: 24px 0 4px; }
.scene-title { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.06; letter-spacing: 0.05em; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); white-space: nowrap; }
.tag-hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 16px -6px var(--accent); }
.scene-sum { color: var(--muted); font-size: 16px; line-height: 1.55; max-width: 66ch; }

.tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.tab { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 50px; padding: 0 16px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--active); }
.tab .n { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px var(--accent); }
.tab-body { display: grid; gap: 10px; padding-top: 14px; }

/* sons dentro das notas: botões no meio do texto */
.cue-pill { display: inline-flex; align-items: center; gap: 6px; vertical-align: 1px; min-height: 30px; margin: 1px 2px; padding: 2px 12px 2px 8px; border-radius: 999px; border: 1px solid var(--cp, var(--active)); background: color-mix(in srgb, var(--cp, var(--active)) 14%, var(--surface)); color: var(--fg); font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; transition: background-color 0.12s, box-shadow 0.12s, color 0.12s; }
.cue-pill svg { width: 15px; height: 15px; color: var(--cp, var(--active)); }
.cue-pill .lamp { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--cp, var(--accent)); }
.cue-pill.k-amb { --cp: var(--accent); }
.cue-pill.k-trk { --cp: var(--ok); }
button.cue-pill:hover { box-shadow: 0 0 16px -6px var(--cp, var(--active)); }
button.cue-pill:active, .cue-pill.playing, .cue-pill[aria-pressed="true"] { background: var(--cp, var(--active)); border-color: var(--cp, var(--active)); color: var(--active-ink); box-shadow: 0 0 18px -4px var(--cp, var(--active)); }
.cue-pill.k-amb[aria-pressed="true"], .cue-pill.k-amb.playing { color: var(--accent-ink); }
.cue-pill[aria-pressed="true"] svg, .cue-pill.playing svg, button.cue-pill:active svg { color: inherit; }
.cue-pill[aria-pressed="true"] .lamp { background: currentColor; border-color: currentColor; animation: lamp 2s ease-in-out infinite; }
.cue-pill.miss { --cp: var(--line); color: var(--muted); border-style: dashed; background: transparent; font-weight: 400; }
.cue-pill.miss svg { color: var(--muted); }
.cue-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); }
.cue-pick .lbl-s { margin-right: 6px; }
.cue-pick .linkbtn { margin-left: auto; }
.icon-btn.on { background: var(--active-soft); color: var(--fg); }

/* notas da cena */
details.note { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--card-shadow); }
details.note summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 12px 16px; cursor: pointer; font-weight: 700; font-size: 17px; }
details.note summary::-webkit-details-marker { display: none; }
details.note summary .caret { width: 20px; height: 20px; color: var(--muted); transition: transform 0.15s; }
details.note[open] summary .caret { transform: rotate(180deg); }
.rich { display: grid; gap: 10px; padding: 0 16px 16px; max-width: 72ch; font-size: 17.5px; line-height: 1.6; }
.rich ul { padding-left: 1.2em; display: grid; gap: 6px; }
.rich li::marker { color: var(--active); }
.rich .empty-hint { padding: 0; }
.callout { padding: 12px 16px; border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-soft); font-weight: 700; box-shadow: 0 0 24px -10px var(--accent); }
.empty-cta { display: grid; gap: 14px; justify-items: start; padding: 18px 0; color: var(--muted); max-width: 52ch; }

/* imagens */
.now { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 10px; border-radius: 14px; background: var(--stage); border: 1px solid var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 30px -10px var(--accent); }
.now img { width: 150px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 9px; display: block; }
.now-l { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.now-l svg { width: 15px; height: 15px; }
.now-c { font-weight: 700; font-size: 17px; line-height: 1.3; color: #F2F4EF; }
.now-a { color: #A6A2BF; font-size: 14px; }
.now-none { display: grid; place-items: center; min-height: 92px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--stage); color: #8FA19B; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; }
.aud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.aud-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"], .chip[aria-current="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); font-weight: 700; box-shadow: 0 0 18px -4px var(--glow); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.shot { display: grid; min-width: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--card-shadow); }
.shot-b { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; background: var(--stage); }
.shot-b img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 24px -6px var(--accent); }
.shot-badge { position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 0 14px -4px var(--accent); }
.shot-badge svg { width: 13px; height: 13px; }
.shot figcaption { padding: 8px 12px 10px; font-size: 14px; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* adversários */
.adv { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--card-shadow); }
.adv header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.adv h3 { font-size: 17px; font-weight: 700; }
.stats { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.toks { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--fg); background: var(--surface-2); font-family: var(--font-mono); font-weight: 500; }
.tok.down { border-color: var(--line); color: var(--muted); background: transparent; }
.gauge { display: grid; grid-template-columns: 82px minmax(0, 1fr); align-items: center; gap: 10px; }
.gauge > span { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pips { display: flex; flex-wrap: wrap; gap: 8px; }
.pip { width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); }
.pip.on { background: var(--hp); border-color: var(--hp); box-shadow: 0 0 14px -3px var(--hp); }
.pip.stress.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px -3px var(--accent); }
.feat { display: grid; gap: 6px; padding-left: 1.2em; font-size: 15px; color: var(--muted); }
.feat strong { color: var(--fg); }
.adv.down { opacity: 0.55; }
.adv.down:hover, .adv.down:focus-within { opacity: 0.85; }
.foe-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.foe-bar .btn svg { width: 16px; height: 16px; }
.atks { display: grid; gap: 8px; }
.atk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.atk-t { display: grid; gap: 2px; min-width: 0; }
.atk-t span { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.atk-b { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.atk-r { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.atk-r b { font-size: 19px; color: var(--fg); margin-right: 8px; }
.atk-r.good b { color: var(--ok); } .atk-r.bad b { color: var(--hp); }
@media (max-width: 560px) { .atk { grid-template-columns: 1fr; } .atk-b { justify-content: flex-start; } }
.hpn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hpn output { font-family: var(--font-mono); font-size: 22px; min-width: 4.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.hpn small { color: var(--muted); font-size: 14px; }
.feats { font-size: 15px; color: var(--muted); display: grid; gap: 6px; }
.feats ul { padding-left: 1.2em; display: grid; gap: 6px; }
.feats strong { color: var(--fg); }
.feats li::marker { color: var(--active); }

/* grupo da mesa online: quadros no topo da Mesa (estilo grupo de MMORPG) */
.mesa-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.mesa-wrap > .mesa { height: 100%; min-height: 0; }
.partybar { width: 100%; max-width: var(--wide); margin: 0 auto; padding: 12px var(--gutter-r) 0 var(--gutter); display: flex; align-items: stretch; gap: 10px; min-width: 0; }
.pfs { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pfs::-webkit-scrollbar { display: none; }
.pf { flex: 1 1 214px; min-width: 196px; max-width: 290px; position: relative; overflow: hidden; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px 10px; align-content: start; padding: 8px 10px 9px 8px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface-2), var(--surface) 75%); box-shadow: var(--card-shadow); transition: border-color 0.15s, box-shadow 0.15s; }
.pf::after { content: ""; position: absolute; inset: 0 12px auto; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--fg) 14%, transparent), transparent); }
.pf:hover { border-color: var(--active-line); box-shadow: var(--card-shadow), 0 0 22px -10px var(--glow); }
.pf.off { background: var(--surface); }
.pf.off .pf-av, .pf.off .pf-b, .pf.off .pf-m { filter: grayscale(0.9); opacity: 0.7; }
.pf.off .pf-n { color: var(--muted); }
.pf-av { position: relative; width: 40px; height: 40px; border-radius: 11px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; }
.pf-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
.pf-av .ini, .tst-av .ini { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--muted); }
.pf-dot { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--line); border: 2px solid var(--surface-2); }
.pf.on .pf-dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.pf-tx { min-width: 0; display: grid; align-content: center; gap: 1px; }
.pf-n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.25; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-s { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-b { grid-column: 1 / -1; display: grid; gap: 5px; }
.pbar { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; line-height: 1; letter-spacing: 0.04em; color: var(--muted); }
.pbar-t { position: relative; height: 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.pbar-t i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--ok); box-shadow: 0 0 10px -2px var(--ok); transition: width 0.6s ease; }
.pbar.low .pbar-t i { background: var(--warn-c); box-shadow: 0 0 10px -2px var(--warn-c); }
.pbar.crit .pbar-t i { background: var(--hp); box-shadow: 0 0 12px -2px var(--hp); animation: pulse 1.6s ease-in-out infinite; }
.pbar.fp .pbar-t i { background: var(--active); box-shadow: 0 0 10px -2px var(--active); }
.pbar-v { color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbar-v small { color: var(--accent); font-size: inherit; margin-left: 3px; }
.pbar-s { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; }
.pbar-s i { height: 9px; border-radius: 2px; background: var(--bg); border: 1px solid var(--line); }
.pbar.hp .pbar-s i.f { background: var(--ok); border-color: var(--ok); }
.pbar.hp.low .pbar-s i.f, .pbar.st .pbar-s i.f { background: var(--warn-c); border-color: var(--warn-c); }
.pbar.hp.crit .pbar-s i.f { background: var(--hp); border-color: var(--hp); }
.pbar.st.crit .pbar-s i.f { animation: pulse 1.6s ease-in-out infinite; }
.pf-m { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pf-hope { display: inline-flex; align-items: center; gap: 4px; }
.pf-hope i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--ok); }
.pf-hope i.f { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.pb-acts { flex: none; display: grid; gap: 6px; align-content: center; }
.pb-acts .btn { justify-content: flex-start; min-height: 34px; padding: 0 12px; }
.pb-acts .btn svg { width: 16px; height: 16px; }
.hist-b .cnt { min-width: 20px; height: 20px; padding: 0 6px; margin-left: auto; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 11px; line-height: 20px; text-align: center; box-shadow: 0 0 10px -2px var(--accent); }
.hist-b[aria-expanded="true"] { border-color: var(--active); }
.pb-none { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 8px 10px 8px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 15px; }
.pb-none .btn svg { width: 16px; height: 16px; }
@media (max-width: 760px) {
  .mesa-wrap { display: block; height: auto; }
  .partybar { flex-direction: column; padding-top: 10px; }
  .pb-acts { grid-auto-flow: column; justify-content: start; }
  .mesa-wrap > .mesa { height: auto; }
}

/* avisos de 20 s (rolagens e itens dos jogadores), no canto de baixo */
.mtoasts { position: fixed; z-index: 35; left: max(var(--gutter), calc((100vw - var(--wide)) / 2 + 16px)); bottom: 96px; width: min(360px, calc(100vw - 32px)); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.tst { display: grid; grid-template-rows: 1fr; margin-top: 8px; pointer-events: auto; cursor: pointer; animation: tst-in 0.38s cubic-bezier(0.2, 0.9, 0.25, 1.15); transition: grid-template-rows 0.45s ease, margin 0.45s ease, opacity 0.4s ease, transform 0.45s ease; }
.tst.out { grid-template-rows: 0fr; margin-top: 0; opacity: 0; transform: translateX(-28px); pointer-events: none; }
.tst-w { min-height: 0; overflow: hidden; }
.tst-c { --tc: var(--active); position: relative; overflow: hidden; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 10px 14px 12px; border-radius: 14px; background: color-mix(in srgb, var(--surface-2) 96%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--line); box-shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.7), 0 0 30px -16px var(--glow); }
.tst-c::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc); box-shadow: 0 0 12px var(--tc); }
.tst.t-good .tst-c { --tc: var(--ok); } .tst.t-bad .tst-c { --tc: var(--hp); } .tst.t-hot .tst-c { --tc: var(--warn-c); }
.tst-av { width: 40px; height: 40px; border-radius: 11px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; color: var(--active); }
.tst-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tst-av svg { width: 21px; height: 21px; }
.tst-x { min-width: 0; display: grid; gap: 1px; }
.tst-who { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tst-who small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.tst-l { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.tst-l em { font-style: normal; font-weight: 700; color: var(--tc); }
.tst-d { font-family: var(--font-mono); font-size: 12px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tst-n { font-family: var(--font-mono); font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.tst.t-good .tst-n { color: var(--ok); } .tst.t-bad .tst-n { color: var(--hp); } .tst.t-hot .tst-n { color: var(--warn-c); }
.tst.crit .tst-c { --tc: var(--crit); border-color: color-mix(in srgb, var(--crit) 60%, var(--line)); box-shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.7), 0 0 34px -8px color-mix(in srgb, var(--crit) 70%, transparent); }
.tst.crit .tst-n { color: var(--crit); text-shadow: 0 0 16px color-mix(in srgb, var(--crit) 80%, transparent); }
.tst.fumble .tst-c { border-color: color-mix(in srgb, var(--hp) 55%, var(--line)); box-shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.7), 0 0 34px -10px var(--hp); }
.tst.item .tst-c { background: linear-gradient(100deg, color-mix(in srgb, var(--active) 18%, transparent), transparent 60%), color-mix(in srgb, var(--surface-2) 96%, transparent); }
.tst.item .tst-av { border-color: var(--active-line); }
.tst-t { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--active)); transform-origin: left center; animation: tst-time var(--tt, 20s) linear forwards; opacity: 0.85; }
@keyframes tst-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes tst-fade { from { opacity: 0; } }
@keyframes tst-time { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (max-width: 560px) { .mtoasts { left: var(--gutter); right: var(--gutter-r); width: auto; } .tst-n { font-size: 26px; } }

/* histórico guardado (botão Rolagens) */
.mhist { position: fixed; z-index: 46; width: min(440px, calc(100vw - 32px)); max-height: min(70vh, 600px); display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.75), 0 0 40px -18px var(--glow); overflow: hidden; }
.mhist[hidden] { display: none; }
.mhist-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.mhist-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; }
.mhist .feed-list { padding: 8px; overflow-y: auto; overscroll-behavior: contain; align-content: start; }
.feed-list { list-style: none; padding: 0; display: grid; gap: 6px; }
.feed-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.feed-list li.fresh { border-color: var(--accent); box-shadow: 0 0 20px -8px var(--accent); }
.feed-list .fw { font-weight: 700; }
.feed-list .fw small { color: var(--muted); font-weight: 400; font-family: var(--font-mono); font-size: 12px; margin-left: 8px; }
.feed-list .fe { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.feed-list .fr { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.feed-list .fr.good { color: var(--ok); } .feed-list .fr.bad { color: var(--hp); } .feed-list .fr.hot { color: var(--warn-c); }
.feed-empty { color: var(--muted); border-style: dashed !important; }
.feed-list li.ev { background: linear-gradient(90deg, color-mix(in srgb, var(--active) 10%, transparent), transparent 70%), var(--surface); border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
.feed-list li.ev .fw svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; color: var(--active); }
.feed-list li.ev .fe { color: var(--fg); }
.feed-list li.ev .fw, .feed-list li.ev .fe { grid-column: 1; }

/* console de som */
.console {
  align-self: start; max-height: calc(100% - 28px); margin: 14px 0;
  overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px;
  box-shadow: var(--card-shadow), 0 0 50px -30px var(--glow);
}
.c-sec { display: grid; gap: 8px; }
.c-sec > h2 { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.3; }
.c-empty { color: var(--muted); font-size: 14px; }
.c-music { display: grid; gap: 10px; }
.music { display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: center; gap: 14px; }
.play { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: var(--active); color: var(--active-ink); text-decoration: none; box-shadow: 0 0 0 4px var(--glow-1), 0 0 26px -2px var(--glow); }
.play svg { width: 28px; height: 28px; }
.play .ic-play { margin-left: 3px; }
.play.off { background: var(--surface-2); color: var(--muted); box-shadow: none; }
.play:active { filter: brightness(0.85); }
.m-txt { display: grid; gap: 2px; min-width: 0; justify-items: start; }
.m-name { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.m-terms { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.sp-msg { font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
.sp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.sp-row strong { color: var(--fg); }
.sp-devs { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-vol { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; }
.sp-vol span { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
/* tocando agora */
.sp-now { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.sp-now img, .sp-now-ph { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.sp-now-ph svg { width: 22px; height: 22px; }
.sp-now-t { min-width: 0; display: grid; gap: 1px; }
.sp-now-t .lbl-s { color: var(--ok); }
.sp-now.paused .sp-now-t .lbl-s { color: var(--muted); }
.sp-now-n { font-weight: 700; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-now-a { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-now-bar { height: 4px; margin-top: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.sp-now-bar i { display: block; height: 100%; border-radius: inherit; background: var(--ok); box-shadow: 0 0 8px -1px var(--ok); }
.sp-now.paused .sp-now-bar i { background: var(--muted); box-shadow: none; }
.sp-now-tm { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* buscar no Spotify (Preparar) */
.sp-findbox { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); }
.sp-find { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sp-find input[type="search"] { flex: 1 1 240px; width: auto; min-width: 0; }
.sp-res { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; max-height: 420px; overflow-y: auto; overscroll-behavior: contain; }
.sp-res li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px 6px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.sp-res img, .sp-res .ph { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.sp-res .ph svg { width: 18px; height: 18px; }
.sp-res-t { min-width: 0; }
.sp-res-t b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-res-t small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-res .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ok); margin-right: 8px; }
input[type="search"] { -webkit-appearance: none; appearance: none; width: 100%; min-height: 46px; padding: 10px 12px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; transition: border-color 0.12s, box-shadow 0.12s; }
.tracks { list-style: none; padding: 0; display: grid; gap: 6px; }
.trk { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); text-align: left; font-size: 14px; font-weight: 700; }
.trk[aria-current="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 18px -6px var(--glow); }
.trk-num { font-family: var(--font-mono); font-weight: 400; font-size: 12px; text-align: right; }
.combo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.ambs { display: grid; gap: 6px; }
.amb { display: grid; grid-template-columns: minmax(150px, 1.35fr) minmax(0, 1fr); align-items: center; gap: 10px; }
.amb-t { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); text-align: left; font-weight: 700; line-height: 1.2; min-width: 0; transition: background-color 0.12s, color 0.12s, border-color 0.12s; }
.amb-t .n { overflow: hidden; text-overflow: ellipsis; }
.lamp { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); }
.amb-t[aria-pressed="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 22px -6px var(--glow); }
.amb-t[aria-pressed="true"] .lamp { background: var(--active-ink); border-color: var(--active-ink); animation: lamp 2s ease-in-out infinite; }
@keyframes lamp { 50% { opacity: 0.45; } }
.pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad { display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-height: 58px; padding: 8px 11px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); text-align: left; transition: background-color 0.12s, color 0.12s, border-color 0.12s, box-shadow 0.12s; }
.pad .n { font-weight: 700; line-height: 1.2; }
.pad .m { font-family: var(--font-mono); font-size: 12px; opacity: 0.75; }
.pad.wide { grid-column: 1 / -1; min-height: 48px; flex-direction: row; align-items: center; }
.pad:active, .pad.playing { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 22px -4px var(--accent); }

/* ---------- barra inferior da Mesa ---------- */
.dock {
  grid-row: 3; position: relative; z-index: 25;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  box-shadow: 0 -14px 30px -24px var(--glow);
  padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter);
}
.dock-in { max-width: var(--wide); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; min-height: 52px; }
.trk-g { display: flex; align-items: center; gap: 10px; }
.trk-n { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.fear .trk-n { color: var(--fear); font-size: 18px; }
.rnd { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--fg); font-size: 24px; line-height: 1; }
.rnd:active { background: var(--fg); color: var(--bg); }
.fear-v { min-width: 2ch; text-align: center; font-family: var(--font-mono); font-size: 28px; font-weight: 500; }
.fear-pips { display: flex; gap: 4px; }
.fear-pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.fear-pips i.on { background: var(--fear); border-color: var(--fear); box-shadow: 0 0 9px var(--fear); }
.cd-pips { display: flex; gap: 8px; }
.cd-pip { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); }
.cd-pip.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px -3px var(--accent); }
.cd.done .trk-n { color: var(--accent); }
.dock-r { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tgl[aria-pressed="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 22px -6px var(--glow); }
.vol { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); flex: 1 1 0; min-width: 130px; max-width: 340px; }
.vol .lbl-s { white-space: nowrap; }
.vol svg { width: 20px; height: 20px; }
.vol input { width: auto; flex: 1 1 140px; min-width: 80px; max-width: 180px; }

/* ---------- Preparar ---------- */
.prep { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 28px; height: 100%; max-width: var(--wide); margin: 0 auto; padding: 0 var(--gutter-r) 0 var(--gutter); }
.side { overflow-y: auto; overscroll-behavior: contain; padding: 22px 2px 32px; display: grid; align-content: start; gap: 12px; }
.side-h { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px; }
.scene-list { list-style: none; padding: 0; display: grid; gap: 8px; }
.scene-item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 8px; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-height: 52px; align-content: center; }
.scene-item:hover { border-color: var(--muted); }
.scene-item .num { color: var(--muted); font-family: var(--font-mono); font-size: 13px; text-align: right; padding-top: 2px; }
.scene-item .t { font-weight: 700; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.scene-item .k { grid-column: 2; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); line-height: 1.4; padding-top: 2px; }
.scene-item[aria-current="true"] { background: var(--active); border-color: var(--active); color: var(--active-ink); box-shadow: 0 0 18px -4px var(--glow); }
.scene-item[aria-current="true"] .num, .scene-item[aria-current="true"] .k { color: var(--active-ink); opacity: 0.75; }
.scene-tools { display: flex; gap: 2px; padding: 4px 0 2px 30px; }
.arm { display: grid; gap: 8px; margin: 4px 0 4px 30px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hp); background: var(--hp-soft); font-size: 14px; }
.arm .row { display: flex; gap: 6px; }
.add-scene { justify-content: center; border-style: dashed !important; }
.editor { overflow-y: auto; overscroll-behavior: contain; scroll-padding-top: 76px; min-width: 0; }
.sec-nav { position: sticky; top: 0; z-index: 3; padding: 14px 0 10px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.sec-nav-in { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; max-width: 52rem; }
.sec-a { flex: none; min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; white-space: nowrap; }
.sec-a:hover { border-color: var(--active); box-shadow: 0 0 14px -6px var(--glow); }
.doc { max-width: 52rem; padding: 10px 0 160px; display: grid; gap: 34px; }
.doc-head { display: grid; gap: 8px; }
.sec { position: relative; display: grid; gap: 14px; min-width: 0; padding-top: 18px; scroll-margin-top: 76px; }
.sec::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, var(--active), var(--line) 38%, transparent); }
.sec-plain { padding-top: 0; }
.sec-plain::before { display: none; }
.sec-h { display: grid; gap: 4px; }
.sec h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; }
.sec h3 { font-size: 16px; font-weight: 700; }
.sub-sec { display: grid; gap: 12px; padding-top: 8px; }
.title-input { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 3.4vw, 42px); letter-spacing: 0.04em; line-height: 1.1; min-height: 0 !important; padding: 2px 0 8px !important; background: transparent !important; border: 0 !important; border-bottom: 1px dashed transparent !important; border-radius: 0 !important; box-shadow: none !important; }
.title-input:hover { border-bottom-color: var(--line) !important; }
.title-input:focus { border-bottom-color: var(--active) !important; }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.facts-grid.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.note-ed { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--card-shadow); }
.note-ed-h { display: flex; align-items: center; gap: 6px; }
.note-title, .trk-name, .combo-name { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; }
.note-ed textarea { background: var(--bg); }
.mini-tools { display: flex; gap: 0; }
.trk-ed, .combo-ed { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--card-shadow); }
.foe-ed { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--card-shadow); }
.foe-ed input, .foe-ed textarea { background: var(--bg); }
.foe-nums { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); }
.icon-btn.armed { color: var(--hp); background: var(--hp-soft); }
.warn-t { color: var(--hp); }
.atk-h, .atk-ed { display: grid; grid-template-columns: minmax(120px, 1.3fr) 78px minmax(90px, 0.8fr) minmax(140px, 1.6fr) 34px; gap: 8px; align-items: center; }
.atk-h span { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 760px) {
  .atk-h { display: none; }
  .atk-ed { grid-template-columns: minmax(0, 1fr) 72px 34px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .atk-ed .atk-n { grid-column: 1; grid-row: 1; }
  .atk-ed .atk-bi { grid-column: 2; grid-row: 1; }
  .atk-ed .icon-btn { grid-column: 3; grid-row: 1; }
  .atk-ed .atk-di { grid-column: 1 / 3; grid-row: 2; }
  .atk-ed .atk-ni { grid-column: 1 / -1; grid-row: 3; }
}
.trk-ed-h, .combo-ed-h { display: flex; align-items: center; gap: 10px; }
.trk-ed-h .num { font-family: var(--font-mono); color: var(--muted); font-size: 13px; width: 18px; text-align: right; }
.trk-ed input, .combo-ed input[type="text"] { background: var(--bg); }
.cues { display: grid; gap: 8px; }
.cue { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto 40px; align-items: center; gap: 4px 10px; min-height: 54px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--card-shadow); }
.cue .n { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.cue-k, .cue-src { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); white-space: nowrap; }
.cue-k.k-amb { border-color: var(--active-line); color: var(--fg); }
.add-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.add-bar select, .add-bar input[type="text"], .add-bar input[type="search"] { width: auto; flex: 1 1 220px; }
details.basic { border: 1px dashed var(--line); border-radius: 12px; padding: 0 14px; }

.combo-cues { display: flex; flex-wrap: wrap; gap: 8px; }
.chk { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; cursor: pointer; }

.thumb-img .icon-btn { position: absolute; top: 6px; right: 6px; background: var(--shade); color: #fff; }

.thumb input { background: var(--bg); min-height: 40px; font-size: 15px; }

/* ---------- páginas (Biblioteca, Jogadores, Ajustes) ---------- */
.page { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.page-in { max-width: var(--wide); margin: 0 auto; padding: 28px var(--gutter-r) 120px var(--gutter); display: grid; gap: 30px; }
.page-in > * { max-width: 56rem; }
.page-h { display: grid; gap: 10px; }
.page-h h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.06; letter-spacing: 0.05em; }
.lede { color: var(--muted); font-size: 18px; max-width: 64ch; }
.seg-tabs { position: static; margin-top: 0; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.drop { display: grid; gap: 12px; justify-items: start; padding: 20px; border-radius: 14px; border: 1px dashed var(--line); background: var(--surface); transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s; }
.drop.drag { border-color: var(--active); background: var(--active-soft); box-shadow: 0 0 30px -10px var(--glow); }
.lib-list { list-style: none; padding: 0; display: grid; gap: 8px; }
.lib-row { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.lib-play { flex: none; }
.lib-n { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.lib-cred { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.03em; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fs-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.fs-opts .hint { flex: 1 1 260px; font-size: 13px; }
.fs-info { flex: 1 1 220px; min-width: 0; display: grid; gap: 3px; }
.fs-info .lib-n { flex: none; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; line-height: 1.3; }
.fs-row > .btn { margin-left: auto; }
.fs-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.03em; color: var(--muted); }
.fs-star { color: var(--crit); }
.fs-star i { font-style: normal; color: var(--muted); }
.fs-lic { border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--accent); border-radius: 999px; padding: 0 8px; font-size: 11px; letter-spacing: 0.06em; }
.lib-name { flex: 1 1 160px; min-width: 0; width: auto !important; min-height: 40px !important; background: var(--bg) !important; }
.lib-kind { width: auto !important; min-height: 40px !important; background: var(--bg) !important; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.lib-img { display: grid; gap: 8px; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); align-content: start; }
.lib-img .th { aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: var(--stage); display: grid; place-items: center; color: var(--muted); }
.lib-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-img figcaption { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-img .row { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pal { display: grid; gap: 8px; padding: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; min-height: 64px; }
.pal .sw { display: flex; height: 22px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.25); }
.pal .sw i { flex: 1; display: block; }
.pal .sw i:first-child { flex: 2; }
.pal .n { font-weight: 700; font-size: 15px; line-height: 1.2; }
.pal[aria-pressed="true"] { border-color: var(--active); box-shadow: 0 0 0 2px var(--active), 0 0 22px -6px var(--glow); }
.narrow { max-width: 380px; }
.cred { display: grid; gap: 10px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); box-shadow: 0 0 26px -12px var(--ok); }
.cred-h { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.cred-h svg { width: 18px; height: 18px; color: var(--ok); }
.cred-g { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; align-items: center; }
.cred-g dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cred-g dd { margin: 0; min-width: 0; }
.cred-g code { font-family: var(--font-mono); font-size: 15px; overflow-wrap: anywhere; }
.cred-g code.pw { display: inline-block; font-size: 20px; letter-spacing: 0.06em; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; -webkit-user-select: all; user-select: all; }
.cred-msg { font-family: var(--font-mono); font-size: 13px; min-height: 0; }
.inline-form { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.link-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.link-box code { font-family: var(--font-mono); font-size: 14px; word-break: break-all; color: var(--accent); }
.status-line { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.status-line i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.status-line[data-k="ok"] i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.status-line[data-k="busy"] i { background: var(--active); animation: pulse 1s ease-in-out infinite; }
.status-line[data-k="warn"] i { background: #ff9a6b; }

/* ---------- diálogos ---------- */
.gate {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) var(--gutter-r) 24px var(--gutter);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.gate[hidden] { display: none; }
#gate { background: radial-gradient(60% 50% at 50% 28%, var(--glow-1), transparent 70%), radial-gradient(50% 40% at 80% 90%, var(--glow-2), transparent 70%), var(--bg); }
.gate-card { width: min(400px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; padding: 30px 26px 22px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.75), 0 0 60px -30px var(--glow); }
#gate .gate-card { background: transparent; border-color: transparent; box-shadow: none; }
.gate-logo { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 0 0 1px var(--line), 0 14px 50px var(--glow); }
.gate h1 { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: 0.06em; line-height: 1.15; }
.gate .sub { margin-top: -8px; color: var(--muted); font-size: 15px; }
.gate form { width: 100%; display: grid; gap: 14px; text-align: left; margin-top: 4px; }
.gate .btn.primary { width: 100%; min-height: 50px; font-size: 16px; }
.gate-err { min-height: 20px; color: var(--hp); font-size: 14px; text-align: center; }
.gate-err.ok { color: var(--ok); }
.skip { color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }
.skip:hover { color: var(--fg); }
.dlg-card { width: min(520px, 100%); text-align: left; justify-items: stretch; }
.dlg-card h1 { text-align: left; }
.dlg-card .gate-logo { justify-self: center; }
.dlg-card.home > h1, .dlg-card.home > .sub { text-align: center; }
.adv-list { list-style: none; padding: 0; display: grid; gap: 8px; }
.adv-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.adv-row.warn { border-color: var(--hp); background: var(--hp-soft); }
.adv-row.warn span { flex: 1 1 200px; padding: 4px 6px; font-size: 15px; }
.adv-row input { flex: 1 1 160px; }
.adv-pick { flex: 1 1 140px; min-width: 0; text-align: left; padding: 6px 6px; font-weight: 700; line-height: 1.3; }
.adv-pick small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.adv-pick[aria-current="true"]::before { content: "● "; color: var(--active); }
.dlg-card form { display: grid; gap: 10px; }
.new-adv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.pick-card { width: min(600px, 100%); }
.pick-body { max-height: 52vh; overflow-y: auto; }

/* gaveta de fichas */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); z-index: 40; background: #0A0912; border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer[hidden] { display: none; }
.drawer-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px var(--gutter-r) 12px 16px; background: #131122; border-bottom: 1px solid #2A2645; }
.drawer-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: #E9E6F7; }
.drawer-h .btn { color: #E9E6F7; border-color: #2A2645; background: #1B1830; }
.drawer iframe { flex: 1; width: 100%; border: 0; background: #0A0912; }

/* aviso */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 15px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
body[data-mode="mesa"] .toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.toast.show { opacity: 1; }

/* ---------- tamanhos ---------- */
@media (max-width: 1180px) { :root { --console-w: 372px; } .mesa, .prep { gap: 18px; } }
.vol svg { display: none; }
@media (max-width: 1320px) { .brand span { display: none; } .fear-pips { display: none; } .vol .lbl-s { display: none; } .vol svg { display: block; } }
@media (max-width: 999px) {
  :root { --console-w: 336px; }
  .prep { grid-template-columns: 228px minmax(0, 1fr); }
  .pads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vol .lbl-s { display: none; }
  .amb { grid-template-columns: minmax(120px, 1fr) minmax(0, 0.9fr); }
}
@media (min-width: 761px) { body[data-mode="prep"] .bar-c, body[data-mode="lib"] .bar-c, body[data-mode="online"] .bar-c, body[data-mode="ajustes"] .bar-c { display: none; } }
@media (max-width: 900px) { .brand, .ver { display: none; } .adv-btn { max-width: 170px; } .scene-btn { max-width: 190px; } .bar-c .icon-btn { display: none; } .seg button { padding: 0 14px; } }
@media (max-width: 760px) {
  body[data-mode="lib"] .bar-c, body[data-mode="online"] .bar-c, body[data-mode="ajustes"] .bar-c { display: none; }
  main.app { overflow-y: auto; }
  .mesa, .prep { display: block; height: auto; }
  .roteiro, .editor { overflow: visible; }
  .console { max-height: none; overflow: visible; margin: 16px 0 24px; }
  .side { display: none; }
  .page { height: auto; overflow: visible; }
  .adv-btn span { display: none; }
  .fear-pips { display: none; }
  .inline-form { grid-template-columns: 1fr; }
  .now { grid-template-columns: 96px minmax(0, 1fr); }
  .now .btn { grid-column: 1 / -1; }
  .now img { width: 96px; }
}
@media (max-width: 560px) {
  .bar-in { flex-wrap: wrap; padding-bottom: 8px; }
  .bar-c { order: 3; flex-basis: 100%; justify-content: center; }
  .seg button { padding: 0 12px; }
  .cue { grid-template-columns: 40px minmax(0, 1fr) 40px; }
  .cue-k, .cue-src { display: none; }
  .vol { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  /* com o movimento reduzido no sistema, continuam só os pedidos de propósito: o rastro da nuvem
     (pequeno, na borda do botão) e os avisos que aparecem e somem esmaecendo, sem deslizar */
  .cloud { transition: background 0.3s, box-shadow 0.6s, color 0.3s !important; }
  .cloud .trail g { transition: opacity 0.8s ease !important; }
  .cloud .trail path { animation: cloud-run 14s linear var(--ps, 0s) infinite !important; }
  .cloud .trail .fast path { animation: cloud-run 1.25s linear var(--pf, 0s) infinite !important; }
  .tst { animation: tst-fade 0.4s ease !important; transition: grid-template-rows 0.45s ease, margin 0.45s ease, opacity 0.4s ease !important; }
  .tst.out { transform: none !important; }
  .tst-t { animation: tst-time var(--tt, 20s) linear forwards !important; }
}
</style>

<body>
<header class="bar" id="bar"></header>
<div class="pop" id="pop" hidden></div>
<div class="gate" id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-t">
  <div class="gate-card">
    <img class="gate-logo" src="icon.svg" alt="">
    <h1 id="gate-t">Hollow Table</h1>
    <p class="sub">Entre para abrir sua mesa em qualquer aparelho.</p>
    <form id="gate-form" autocomplete="on">
      <div class="field"><label for="g-email">E-mail</label><input type="email" id="g-email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" required></div>
      <div class="field"><label for="g-pass">Senha</label><input type="password" id="g-pass" name="password" autocomplete="current-password" required></div>
      <p class="gate-err" id="g-err" role="alert"></p>
      <button type="submit" class="btn primary" id="g-go">Entrar</button>

    <button type="button" class="skip" data-action="gateSkip">Continuar sem entrar</button>
  </div>
</div>
<div class="gate dlg" id="advdlg" hidden role="dialog" aria-modal="true" aria-label="Aventuras"></div>
<aside class="drawer" id="jogdrawer" hidden aria-label="Jogadores"><div class="drawer-h"><h2>Jogadores</h2><button type="button" class="btn quiet sm" data-action="jogClose">Fechar</button></div><iframe title="Fichas e mochilas dos jogadores"></iframe></aside>
<div class="gate dlg" id="prodlg" hidden role="dialog" aria-modal="true" aria-label="Perfil"></div>
<div class="gate dlg" id="libdlg" hidden role="dialog" aria-modal="true" aria-label="Biblioteca"></div>
<main class="app" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer class="dock" id="dock" hidden></footer>

  function foesSecHtml() {

  const TABS_ALL = [['notas', 'Notas'], ['adv', 'Adversários'], ['img', 'Imagens']];
  function comboCues(cb) { return (cb.ids || []).map(findCue).filter(Boolean); }
  function combosHtml() {

  /* sons dentro das notas: [[Nome]] vira um botão na Mesa (efeito, ambiente, combo ou música da cena, pelo nome) */
  const CUE_RE = /\[\[([^\[\]\n]{1,60})\]\]/g;

  function cueRef(name) {
    const k = fold(name);
    if (!k) return null;
    const c = S.cues.filter(function (x) { return fold(label(x)) === k; })[0];
    if (c) return { t: c.kind === 'amb' ? 'amb' : 'fx', id: c.id, name: label(c) };
    for (let i = 0; i < S.combos.length; i++) if (fold(S.combos[i].name) === k) return { t: 'combo', i: i, name: S.combos[i].name };
    for (let i = 0; i < S.tracks.length; i++) if (fold(S.tracks[i].name) === k) return { t: 'track', i: i, name: S.tracks[i].name };
    return null;
  }
  function cuePill(name) {
    const r = cueRef(name);

    if (r.t === 'fx') return '<button type="button" class="cue-pill k-fx" data-action="fx" data-id="' + esc(r.id) + '" title="Tocar o efeito">' + ICO.play + esc(r.name) + '</button>';

    if (r.t === 'combo') {
      const on = comboCues(S.combos[r.i]).some(function (c) { return c.kind === 'amb' && active[c.id]; });
      return '<button type="button" class="cue-pill k-combo" data-action="combo" data-i="' + r.i + '" aria-pressed="' + on + '" title="Tocar o combo">' + COMBO_ICO + esc(r.name) + '</button>';

    return inline(keep).replace(/\u0000(\d+)\u0000/g, function (m, k) { return cuePill(names[+k]); });

  /* no editor da nota: escolher um som da cena e pôr [[Nome]] onde o cursor estava */

  function noteCueIns(i, name) {
    const ta = document.getElementById('f-notes.' + i + '.text');

    noteSel[i] = [pos, pos];
    ta.dispatchEvent(new Event('input', { bubbles: true }));

      setPath(S, p, Math.round(Number(t.value) || 0));
      const mm = p.match(/^foes\.(\d+)\.mins$/);
      if (mm && S.foes[+mm[1]]) S.foes[+mm[1]].toks = new Array(clampI(S.foes[+mm[1]].mins, 0, 30)).fill(0);
      save();
      return;
    }
    if (t.getAttribute('data-bind')) {
      setPath(S, t.getAttribute('data-bind'), t.value);
      if (t.getAttribute('data-bind') === 'title') renderScenes();
      save();
      return;
    }
    if (t.id === 'vol-master') {
      S.vol = parseFloat(t.value);
      if (master) rampTo(master.gain, posToGain(S.vol, 1.5), 0.03);
      save();
      return;
    }
    if (t.getAttribute('data-vol')) {
      const id = t.getAttribute('data-vol'), c = findCue(id);
      levels[id] = parseFloat(t.value);
      if (active[id] && c) rampTo(active[id].out.gain, posToGain(levels[id], 1.2) * ambK(c), 0.05);
    }
  });

  document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.getAttribute && t.getAttribute('data-cbx')) {
      const parts = t.getAttribute('data-cbx').split('|'), cb = S.combos[Number(parts[0])];
      if (cb) { cb.ids = cb.ids.filter(function (x) { return x !== parts[1]; }); if (t.checked) cb.ids.push(parts[1]); save(); }
      return;
    }
    if (t.id === 'camp-sys') { campSystemSet(t.value); return; }
    if (t.id === 'fs-len') { fsLen = t.value; if (fsRes && fsQ.trim()) fsSearch(); return; }
    if (t.id === 'fs-cred') { fsCred = t.checked; lsSet(FS_CRED, fsCred); if (fsRes && fsQ.trim()) fsSearch(); else render(); return; }
    if (t.id === 'fade-sel') { lsSet('ht-fade', t.value); return; }
    if (t.getAttribute && t.getAttribute('data-libkind')) { const it = libFind(t.getAttribute('data-libkind')); if (it) { it.kind = t.value; libSave(); } return; }
    if (t.id === 'lib-file' && t.files && t.files.length) { libAddMany(t.files, libTab === 'img' ? 'img' : 'snd', false); t.value = ''; return; }
    if (t.id === 'sp-vol') { spVol = Number(t.value); spSetVol(spVol); return; }
    if (t.tagName === 'SELECT' && t.getAttribute('data-bind')) {
      const p = t.getAttribute('data-bind');
      setPath(S, p, p === 'countdown.max' ? Number(t.value) : t.value);
      if (p === 'countdown.max') S.countdown.value = Math.min(S.countdown.value, S.countdown.max);
      commit();
      return;
    }
    if (t.id === 'file-restore' && t.files && t.files[0]) {
      t.files[0].text().then(function (tx) {
        const j = JSON.parse(tx);
        restoreBackup(j); toast('Backup restaurado.');
      }).catch(function () { toast('Este arquivo não parece um backup do Hollow Table.'); });
      t.value = '';
      return;
    }
    if (t.id === 'file-audio' && t.files && t.files.length && sbUser()) {
      libAddMany(t.files, 'snd', true);
      t.value = '';
      return;
    }
    if (t.id === 'file-img' && t.files && t.files.length && sbUser()) { libAddMany(t.files, 'img', true); t.value = ''; return; }
    if (t.id === 'file-audio' && t.files && t.files[0]) {
      const f = t.files[0], kind = $('#new-kind').value;
      ensure();
      f.arrayBuffer().then(function (buf) {
        return new Promise(function (res, rej) { ctx.decodeAudioData(buf, res, rej); });
      }).then(function (ab) {
        const id = 'f' + Date.now();
        fileBuffers[id] = ab;
        const cue = { id: id, kind: kind, src: 'file', label: f.name.replace(/\.[^.]+$/, '') };
        S.cues.push(cue);
        commit();
        toast(sbUser() ? 'Som adicionado. Enviando para a nuvem…' : 'Som adicionado (só neste aparelho; entre na Nuvem para guardá-lo).');
        const ext = (f.name.match(/\.([A-Za-z0-9]+)$/) || [0, 'mp3'])[1].toLowerCase();
        sbAttach(cue, f, ext, f.type).then(function (ok) { if (sbUser()) toast(ok ? 'Som guardado na nuvem.' : 'Não consegui enviar o som para a nuvem.'); });
      }).catch(function () { toast('Não consegui ler este áudio. Tente mp3, m4a ou wav.'); });
      t.value = '';
      return;
    }
    if (t.id === 'file-img' && t.files && t.files[0]) {
      const f = t.files[0];
      readFile(f).then(function (u) { return downscale(u, 1280); }).then(function (u) {
        if (!u) { toast('Não consegui abrir esta imagem.'); return; }
        const im = { id: 'u' + Date.now(), caption: f.name.replace(/\.[^.]+$/, ''), src: u };
        S.images.push(im);
        commit();
        toast(sbUser() ? 'Imagem adicionada. Enviando para a nuvem…' : 'Imagem adicionada (só neste aparelho; entre na Nuvem para guardá-la).');
        fetch(u).then(function (r) { return r.blob(); }).then(function (bl) { return sbAttach(im, bl, 'jpg', 'image/jpeg'); }).then(function (ok) { if (sbUser()) toast(ok ? 'Imagem guardada na nuvem.' : 'Não consegui enviar a imagem para a nuvem.'); });
      }).catch(function () { toast('Não consegui abrir esta imagem.'); });
      t.value = '';
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && mode === 'prep') { e.preventDefault(); const b = $('[data-action="saveNow"]'); if (b) b.click(); }
  });

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'adv-new') {
      e.preventDefault();
      const f = $('#adv-nn');
      dlg = null; renderDlg(); advCreate(f ? f.value : '');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'adv-rn') { e.preventDefault(); const b = $('[data-action="advRenameOk"]'); if (b) b.click(); }
    if (e.key === 'Escape' && pop) { pop = null; renderPop(); return; }
    if (e.key === 'Escape' && histIsOpen()) { histClose(); const b = $('#histbtn'); if (b) b.focus(); return; }
    if (e.key === 'Escape' && !$('#jogdrawer').hidden) { $('#jogdrawer').hidden = true; return; }
    if (e.key === 'Escape' && libPick) { libPick = null; libStop(); renderPicker(); render(); }
    else if (e.key === 'Escape' && dlg) { dlg = null; renderDlg(); }
  });

  /* guarda onde o cursor estava em cada nota, para inserir o som ali */
  document.addEventListener('focusout', function (e) {
    const t = e.target, b = t && t.getAttribute && t.getAttribute('data-bind'), m = b && b.match(/^notes\.(\d+)\.text$/);
    if (m) noteSel[+m[1]] = [t.selectionStart, t.selectionEnd];
  });
  document.addEventListener('toggle', function (e) {
    const d = e.target;
    if (d && d.matches && d.matches('details.note')) {
      const n = S.notes[Number(d.getAttribute('data-note'))];
      if (n && n.open !== d.open) { n.open = d.open; save(); }
    }
  }, true);

  document.addEventListener('pointerdown', function (e) {
    if (!pop) return;
    if (e.target.closest && (e.target.closest('#pop') || e.target.closest('[data-action="menu"]') || e.target.closest('[data-action="scenesPop"]'))) return;
    pop = null; renderPop();
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { const z = e.target.closest && e.target.closest('#lib-drop'); if (!z) return; e.preventDefault(); z.classList.add('drag'); });
  });
  document.addEventListener('dragleave', function (e) { const z = e.target.closest && e.target.closest('#lib-drop'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag'); });
  document.addEventListener('drop', function (e) {
    const z = e.target.closest && e.target.closest('#lib-drop');
    if (!z) return;
    e.preventDefault(); z.classList.remove('drag');
    const fl = e.dataTransfer && e.dataTransfer.files;
    if (!fl || !fl.length) return;
    const want = libTab === 'img' ? 'image/' : 'audio/';
    const ok = Array.prototype.filter.call(fl, function (f) { return (f.type || '').indexOf(want) === 0; });
    if (!ok.length) { toast(libTab === 'img' ? 'Solte arquivos de imagem aqui.' : 'Solte arquivos de áudio aqui.'); return; }
    libAddMany(ok, libTab === 'img' ? 'img' : 'snd', false);
  });

  /* ---------- início ---------- */
  (function () { try { const pl = localStorage.getItem('cdm-palette'); if (pl) document.documentElement.setAttribute('data-palette', pl); } catch (e) { /* sem armazenamento */ } })();
  setSession('ambient');
  renderScenes();
  render();
  sbInit();
  if (SP.enabled) spHandleCallback().then(render);
})();
</script>
</body>
</html>
