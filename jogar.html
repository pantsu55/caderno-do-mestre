<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hollow Table">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<title>Hollow Table · Jogador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg: #0A0912; --surface: #131122; --surface-2: #1B1830; --line: #2A2645; --fg: #E9E6F7; --muted: #9A95B8; --accent: #5EE1F5; --accent-ink: #031219; --accent-soft: #0E2B36; --ok: #6EE0A8; --bad: #FF8F8F; --hot: #FFB86B; --font: 'Atkinson Hyperlegible', system-ui, sans-serif; --serif: 'Cinzel', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--font); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
main { max-width: 860px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
h1, h2 { font-family: var(--serif); margin: 0; letter-spacing: 0.03em; }
h1 { font-size: 24px; }
h2 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.center { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 16px; padding: 32px 0; }
.logo { width: 72px; height: 72px; border-radius: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
form.stack { display: grid; gap: 14px; width: min(340px, 100%); text-align: left; }
.field { display: grid; gap: 6px; min-width: 0; }
label { font-size: 14px; color: var(--muted); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: inherit; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 220px; line-height: 1.55; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; font: inherit; font-weight: 700; min-height: 46px; padding: 0 18px; cursor: pointer; }
.btn.q { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); font-weight: 400; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 15px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.err { color: var(--bad); min-height: 1.4em; font-size: 15px; }
.err.ok { color: var(--ok); }
.skip { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; min-height: 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 8px; flex-wrap: wrap; }
.top .who { display: flex; gap: 8px; }
.sys { display: inline-block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent-soft); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.camps { display: grid; gap: 12px; width: min(460px, 100%); }
.camp { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 6px; }
.camp:hover { border-color: var(--accent); }
.camp strong { font-family: var(--serif); font-size: 19px; }
.table { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 12px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; background: var(--surface); }
.pill.me { border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 1px solid transparent; border-radius: 999px; color: var(--muted); font: inherit; padding: 8px 16px; min-height: 42px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
.pane { padding: 16px 0 40px; display: grid; gap: 16px; }
.dice { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.die { min-height: 56px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: 700 17px var(--mono); cursor: pointer; }
.die:active { transform: scale(0.97); border-color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.step { display: inline-flex; align-items: center; gap: 6px; }
.step output { min-width: 2.6em; text-align: center; font: 700 18px var(--mono); }
.step button { width: 42px; min-height: 42px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; font-size: 20px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: var(--surface); color: var(--muted); border: 0; font: inherit; padding: 0 14px; min-height: 42px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.result { text-align: center; padding: 14px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-height: 112px; display: grid; place-content: center; gap: 4px; }
.result .n { font: 700 48px/1 var(--mono); }
.result .t { color: var(--muted); font-family: var(--mono); font-size: 14px; }
.result .g { font-family: var(--serif); font-size: 18px; }
.good { color: var(--ok); } .bad { color: var(--bad); } .hot { color: var(--hot); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.log li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; align-items: baseline; }
.log .w { font-weight: 700; }
.log .e { color: var(--muted); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.log .r { font: 700 18px var(--mono); }
.log .tm { color: var(--muted); font-size: 12px; }
.sysbox { display: grid; gap: 10px; }
.notes { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
.nlist { display: grid; gap: 6px; align-content: start; }
.nitem { text-align: left; background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 9px 12px; font: inherit; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 42px; }
.nitem[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
.edit { display: grid; gap: 10px; min-width: 0; align-content: start; }
.sv { font-size: 14px; color: var(--muted); }
.dlg { position: fixed; inset: 0; background: rgba(5,4,10,0.88); display: grid; place-items: center; padding: 16px; z-index: 10; overflow-y: auto; }
.dlg .card { width: min(380px, 100%); }
@media (max-width: 640px) { .notes { grid-template-columns: 1fr; } .nlist { grid-auto-flow: column; grid-auto-columns: minmax(120px, max-content); overflow-x: auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- v2: navegação inferior, resultado no topo, ajustes compactos ---- */
main { padding-bottom: 92px; }
.col { display: grid; gap: 14px; min-width: 0; align-content: start; }
.top { padding: 16px 0 6px; align-items: flex-start; }
.top h1 { font-size: 22px; line-height: 1.2; }
.top .sub { display: flex; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.ghost { background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; min-height: 40px; padding: 0 10px; border-radius: 10px; cursor: pointer; }
.ghost:hover { color: var(--fg); background: var(--surface); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; display: grid; justify-items: center; gap: 2px; padding: 6px 4px; min-height: 54px; border-radius: 12px; cursor: pointer; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.pane { padding: 6px 0 24px; gap: 14px; }
.result { order: 0; min-height: 150px; border-radius: 18px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); padding: 18px 12px; }
.result .n { font-size: 64px; }
.result .n.pop { animation: pop 0.35s ease; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0.2; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
.result .empty { color: var(--muted); font-size: 16px; }
.dgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.dgrid .die { min-height: 64px; font-size: 18px; border-radius: 14px; }
.dgrid .die.big { grid-column: span 2; background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-size: 24px; }
.act { display: grid; gap: 4px; justify-items: center; min-height: 64px; padding: 10px 18px; font-size: 18px; }
.act small { font-weight: 400; font-size: 13px; opacity: 0.85; }
.adj { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; padding: 14px; }
.adj .full { grid-column: 1 / -1; }
.adj .seg { display: flex; width: 100%; }
.adj .seg button { flex: 1; padding: 0 6px; }
.hint-s { color: var(--muted); font-size: 13px; }
details.more { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
details.more summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; color: var(--muted); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: '▾'; margin-left: auto; }
details.more[open] summary::after { content: '▴'; }
details.more .in { display: grid; gap: 14px; padding: 4px 0 16px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--fg); font-size: 16px; }
.chk input { width: 22px; min-height: 22px; height: 22px; }
.log li { grid-template-columns: 1fr auto; gap: 2px 12px; }
.log .l { min-width: 0; display: grid; gap: 1px; }
.log .e { white-space: normal; }
.log .r { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 22px; }
@media (min-width: 760px) {
  main { padding-bottom: 24px; }
  .nav { position: static; border: 0; background: none; justify-content: start; grid-auto-columns: max-content; gap: 6px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
  .nav button { grid-auto-flow: column; align-items: center; font-size: 15px; padding: 8px 16px; min-height: 44px; gap: 8px; }
  .nav button svg { width: 20px; height: 20px; }
  .pane { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .pane > .col { display: grid; gap: 14px; min-width: 0; }
}

/* ---- ficha ---- */
.pane.one { grid-template-columns: 1fr !important; }
.sheet-wrap { display: grid; gap: 12px; }
.sh-head { display: grid; gap: 2px; }
/* campo que outra pessoa (o Mestre ou o jogador) acabou de mudar */
.chg { border-color: var(--hot) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 30%, transparent), 0 0 18px -4px var(--hot); transition: box-shadow 0.6s ease, border-color 0.6s ease; }
.track.chg { border-radius: 10px; }
.sheet { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.sheet .card { min-width: 0; }
.sheet .idc, .sheet .card:last-child { grid-column: 1 / -1; }
.idc { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 16px; align-items: start; }
.idf { display: grid; gap: 10px; min-width: 0; }
.idf .nm { font-family: var(--serif); font-size: 22px; font-weight: 700; }
.avatar { width: 128px; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 14px; border: 1px dashed var(--line); background: var(--surface-2); display: grid; place-items: center; overflow: hidden; cursor: pointer; color: var(--muted); font-size: 13px; text-align: center; position: relative; padding: 0; }
.avatar span { padding: 10px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; display: grid; gap: 6px; justify-items: center; text-align: center; min-width: 0; }
.stat .k { font: 700 12px var(--mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.stat input { text-align: center; font: 700 22px var(--mono); padding: 4px; min-height: 44px; }
.stat .m { font: 700 16px var(--mono); color: var(--accent); }
.mono { font-family: var(--mono); }
.big { font-size: 20px; }
.rb { background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; min-height: 36px; padding: 0 10px; cursor: pointer; white-space: nowrap; }
.rb:hover { border-color: var(--accent); }
.track { display: grid; gap: 6px; min-width: 0; flex: 1 1 200px; }
.track .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.track .tl b { font-family: var(--mono); color: var(--fg); }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pip { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; padding: 0; }
.pip.on { background: var(--accent); border-color: var(--accent); }
.track.hp .pip.on { background: var(--bad); border-color: var(--bad); }
.track.st .pip.on { background: var(--hot); border-color: var(--hot); }
.track.hope .pip { border-radius: 50%; }
.track.hope .pip.on { background: var(--ok); border-color: var(--ok); }
.mxl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.mx { width: 64px; min-height: 34px; padding: 4px 6px; text-align: center; }
.lrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lrow .field { min-width: 0; }
.sm-x { min-height: 44px; }
.skl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 42px; border-bottom: 1px solid var(--line); }
.skl:last-child { border-bottom: 0; }
.prof { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }
.prof[data-v="1"] { background: var(--accent-soft); border-color: var(--accent); }
.prof[data-v="2"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slotmax { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.slotmax .mx { width: 52px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
select { appearance: auto; }
input:disabled, textarea:disabled, select:disabled { opacity: 1; color: var(--fg); background: var(--surface); }
@media (max-width: 520px) { .idc { grid-template-columns: 1fr; justify-items: center; } .idc .idf { width: 100%; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.embed main { padding-bottom: 24px; max-width: none; }
.embed body { padding-top: 8px; }
.emb-tabs { display: flex; gap: 6px; padding: 2px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.nav button { position: relative; }
.nb { position: absolute; top: 7px; right: 22%; width: 9px; height: 9px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px rgba(255, 184, 107, 0.7); }
@media (min-width: 760px) { .nb { top: 6px; right: 6px; } }

/* ---- mochila ---- */
.dlg { place-items: start center; }
.dlg > .card { margin-block: auto; }
.dlg .card.wide { width: min(640px, 100%); }
.between { justify-content: space-between; align-items: center; }
.card h2 svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; color: var(--accent); }
.bag-grid { display: grid; gap: 14px; align-items: start; }
@media (min-width: 900px) { .bag-grid { grid-template-columns: minmax(0, 1.55fr) minmax(290px, 1fr); } }
.bag-main, .bag-side { display: grid; gap: 14px; min-width: 0; align-content: start; }
.bag-tools { display: grid; gap: 10px; }
.bag-tools .btn svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; }
.chip .ct { font-family: var(--mono); font-size: 12px; opacity: 0.75; }
.chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.chip:disabled { opacity: 0.45; cursor: default; }
.grp { display: grid; gap: 8px; }
.grp-h { display: flex; align-items: center; gap: 10px; font: 700 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.grp-h .ct { color: var(--accent); }
.grp-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.its { display: grid; gap: 8px; }
.it { --r: transparent; --rc: var(--fg); position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.it::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--r); }
.r-inc { --r: #6EE0A8; --rc: #9BF2C6; } .r-rar { --r: #6FA8FF; --rc: #A3C6FF; } .r-mr { --r: #B48BFF; --rc: #D0B5FF; } .r-len { --r: #FFB86B; --rc: #FFCC91; } .r-art { --r: #FF7A90; --rc: #FFA2B1; }
.it.open { box-shadow: 0 0 0 1px var(--accent-soft), 0 10px 30px rgba(0, 0, 0, 0.35); }
.it-main { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 10px 8px 10px 14px; cursor: pointer; min-height: 60px; min-width: 0; }
.it-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.it-ic svg { width: 20px; height: 20px; }
.it.eq .it-ic { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 16px rgba(94, 225, 245, 0.28); }
.it-tx { min-width: 0; display: grid; gap: 2px; }
.it-n { font-weight: 700; color: var(--rc, var(--fg)); overflow-wrap: anywhere; }
.it-s { color: var(--muted); font: 13px/1.4 var(--mono); overflow-wrap: anywhere; }
.it-q { font: 700 15px var(--mono); padding: 3px 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.it-acts { display: flex; gap: 6px; padding: 8px 12px 8px 0; }
.it-more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 10px; background: rgba(4, 3, 10, 0.25); }
.it-more .row { gap: 8px; }
.it-notes { white-space: pre-wrap; font-size: 15px; overflow-wrap: anywhere; }
.it-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 13px var(--mono); color: var(--muted); }
.it-meta b { color: var(--fg); font-weight: 700; }
.warnl { color: var(--hot); }
.danger { color: var(--bad) !important; border-color: var(--bad) !important; }
@media (max-width: 560px) { .it { grid-template-columns: 1fr; } .it-acts { padding: 0 12px 12px 64px; flex-wrap: wrap; } }
.purse { display: grid; grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 8px; }

    if (!LIVE) return;
    let el = $('#stage');
    if (!el) { el = document.createElement('div'); el.id = 'stage'; el.className = 'stage'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Imagem que o Mestre está mostrando'); document.body.appendChild(el); }
    const m = MEM && MEM.items.filter(function (x) { return x.show === LIVE.id; })[0];
    el.innerHTML = '<div class="stage-in"><p class="stage-l">' + EYE + 'O Mestre está mostrando</p>' +
      '<img src="' + imgUrls['mesa/' + LIVE.path] + '" alt="' + esc(LIVE.caption || 'Imagem da mesa') + '">' + (LIVE.caption ? '<p class="stage-c">' + esc(LIVE.caption) + '</p>' : '') +
      (m ? '<div class="field stage-note"><label for="snote">Na sua memória. Quer anotar algo?</label><textarea id="snote" data-mnote="' + m.id + '" rows="2" maxlength="2000" placeholder="O que isso lembra, onde foi, quem mostrou…">' + esc(m.note || '') + '</textarea></div>' : '') +
      '<div class="stage-b">' + (m ? '' : '<button type="button" class="btn" data-m="memlive"' + (memBusy ? ' disabled' : '') + '>' + (memBusy ? 'Guardando…' : 'Memorizar') + '</button>') + '<button type="button" class="btn q" data-m="stageclose">' + (m ? 'Pronto' : 'Fechar') + '</button></div></div>';
    el.hidden = false;
    paintPill();
  }
  function stageHide() { const el = $('#stage'); if (el) el.hidden = true; }
  function stageClose() { if (LIVE) liveSeen = LIVE.key; stageHide(); paintPill(); }
  function paintPill() {
    let el = $('#pill');
    const st = $('#stage'), on = !!(LIVE && (!st || st.hidden) && !EMBED);
    document.body.classList.toggle('has-pill', on);
    if (!on) { if (el) el.hidden = true; return; }
    if (!el) { el = document.createElement('button'); el.type = 'button'; el.id = 'pill'; el.className = 'pill'; document.body.appendChild(el); }
    el.dataset.m = 'stageopen';
    el.innerHTML = '<img src="' + imgUrls['mesa/' + LIVE.path] + '" alt="">' + EYE + '<span>Na mesa agora</span>';
    el.hidden = false;
  }

  /* memória: imagens guardadas pelo jogador, com anotação */
  async function ensureMem() {
    if (MEM && memFor === cur.id && memOk) return;
    if (!MEM || memFor !== cur.id) MEM = lsGet(mkey(), { items: [] });
    memFor = cur.id;
    try {
      const r = await api('/rest/v1/pdocs?campaign_id=eq.' + cur.id + '&kind=eq.memory&user_id=eq.' + me().id + '&select=data');
      if (!r.ok) throw new Error('x');
      const j = await r.json();
      if (memFor !== cur.id) return;
      if (j[0] && j[0].data && Array.isArray(j[0].data.items)) { MEM = j[0].data; lsSet(mkey(), MEM); }
      memOk = true;
    } catch (e) { memSv = 'Sem conexão. Mostrando o que está neste aparelho.'; }
  }
  async function loadMem() {
    if (memFor !== cur.id) { MEM = null; memOk = false; SHOWS = null; }
    paintMem();
    await ensureMem();
    paintMem();
    loadShows();
  }
  async function loadShows() {
    if (!cur) return;
    const cid = cur.id;
    try {
      const r = await api('/rest/v1/shows?campaign_id=eq.' + cid + '&select=id,path,caption,shown_at&order=shown_at.desc&limit=24');
      if (!r.ok) throw new Error('x');
      const j = await r.json();
      if (!cur || cur.id !== cid) return;
      const sig = JSON.stringify(j.map(function (x) { return x.id + x.shown_at; }));
      if (sig === loadShows.sig && SHOWS) return;
      loadShows.sig = sig; SHOWS = j;
      if (tab === 'memoria') paintMem();
    } catch (e) { if (!SHOWS) { SHOWS = []; if (tab === 'memoria') paintMem(); } }
  }
  function memSaveSoon() { memSv = 'Salvando…'; paintMemSv(); clearTimeout(memT); memT = setTimeout(memSave, 800); }
  async function memSave() {
    clearTimeout(memT); memT = null;
    lsSet(mkey(), MEM);
    try {
      const r = await api('/rest/v1/pdocs?on_conflict=campaign_id,user_id,kind', { method: 'POST', headers: Object.assign({ Prefer: 'resolution=merge-duplicates,return=minimal' }, JSONH), body: JSON.stringify({ campaign_id: cur.id, kind: 'memory', data: MEM }) });
      if (!r.ok) throw new Error('x');
      memSv = 'Salvo na nuvem';
    } catch (e) { memSv = 'Sem conexão. Salvo neste aparelho.'; }
    paintMemSv();
  }
  function paintMemSv() { const el = $('#memsv'); if (el) el.textContent = memSv; }
  async function memAdd(blob, cap, showId) {
    await ensureMem();
    if (showId && memHasShow(showId)) return MEM.items.filter(function (x) { return x.show === showId; })[0];
    const jpg = await toJpeg(blob, 1600);
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const path = cur.id + '/' + me().id + '/mem-' + id + '.jpg';
    const r = await api('/storage/v1/object/players/' + path, { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: jpg });
    if (!r.ok) throw new Error('envio');
    imgUrls['players/' + path] = URL.createObjectURL(jpg);
    const m = { id: id, path: path, cap: String(cap || '').slice(0, 80), note: '', at: Date.now(), show: showId || null };
    MEM.items.unshift(m);
    await memSave();
    return m;
  }
  async function memorizeShow(sh) {
    if (!sh || memBusy) return;
    memBusy = true; refreshMemViews();
    try {
      const u = await imgUrl('mesa', sh.path);
      const blob = await (await fetch(u)).blob();
      await memAdd(blob, sh.caption || 'Imagem da mesa', sh.id);
      msgToast('Guardada na sua memória.', 'good');
    } catch (e) { msgToast('Não consegui guardar esta imagem. Tente de novo.', 'bad'); }
    memBusy = false; refreshMemViews();
  }
  function refreshMemViews() {
    const st = $('#stage');
    if (st && !st.hidden) stageShow();
    if (tab === 'memoria') paintMem();
    if (memOpenId) memView(memOpenId);
  }
  async function memUpload(file) {
    if (memBusy) return;
    memBusy = true; memSv = 'Guardando a imagem…'; paintMem();
    try { await memAdd(file, String(file.name || 'Imagem').replace(/\.[a-z0-9]+$/i, '')); memSv = 'Salvo na nuvem'; }
    catch (e) { memSv = 'Não consegui usar esta imagem.'; }
    memBusy = false; paintMem();
  }
  async function memDelete(id) {
    const m = MEM.items.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    MEM.items = MEM.items.filter(function (x) { return x.id !== id; });
    memDelArm = ''; memOpenId = ''; dlgClose();
    paintMem(); await memSave();
    api('/storage/v1/object/players/' + m.path, { method: 'DELETE' }).catch(function () { /* ok */ });
  }
  function memView(id) {
    const m = MEM && MEM.items.filter(function (x) { return x.id === id; })[0];
    if (!m) { memOpenId = ''; return; }
    memOpenId = id;
    const u = imgUrls['players/' + m.path];
    dlgShow('<div class="card wide"><div class="row between"><h2>' + esc(m.cap || 'Memória') + '</h2><button type="button" class="ghost" data-m="close">Fechar</button></div>' +
      '<div class="mem-big">' + imgTag('players', m.path, m.cap) + '</div>' +
      (u ? '<a class="ghost" href="' + u + '" target="_blank" rel="noopener">Abrir a imagem inteira</a>' : '') +
      '<div class="field"><label for="mcap">Título</label><input id="mcap" data-mcap="' + m.id + '" maxlength="80" value="' + esc(m.cap) + '"></div>' +
      '<div class="field"><label for="mnote">Anotação</label><textarea id="mnote" data-mnote="' + m.id + '" rows="4" maxlength="2000" style="min-height:0" placeholder="O que isso lembra, onde foi, quem mostrou…">' + esc(m.note || '') + '</textarea></div>' +
      '<p class="hint-s">Guardada em ' + new Date(m.at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + (m.show ? ', quando o Mestre mostrou' : '') + '. Só você vê a sua memória.</p>' +
      '<div class="row"><button type="button" class="rb' + (memDelArm === m.id ? ' danger' : '') + '" data-m="del" data-id="' + m.id + '">' + (memDelArm === m.id ? 'Confirmar: apagar da memória' : 'Apagar da memória') + '</button></div></div>');
    hydrate($('#dlg'));
  }
  function showView(id) {
    const sh = (SHOWS || []).filter(function (x) { return x.id === id; })[0] || (LIVE && LIVE.id === id ? LIVE : null);
    if (!sh) return;
    memOpenId = '';
    const has = memHasShow(sh.id);
    dlgShow('<div class="card wide"><div class="row between"><h2>' + esc(sh.caption || 'Imagem da mesa') + '</h2><button type="button" class="ghost" data-m="close">Fechar</button></div>' +
      '<div class="mem-big">' + imgTag('mesa', sh.path, sh.caption) + '</div>' +
      '<p class="hint-s">O Mestre mostrou em ' + new Date(sh.shown_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '.</p>' +
      (has ? '<p class="sv good">Já está na sua memória.</p>' : '<button type="button" class="btn" data-m="memshow" data-id="' + sh.id + '">Memorizar</button>') + '</div>');
    hydrate($('#dlg'));
  }
  function paintMem() {
    const box = $('#mem');
    if (!box || !cur) return;
    if (!MEM) { box.innerHTML = '<p class="muted" role="status">Abrindo a memória…</p>'; return; }
    const items = MEM.items;
    const live = LIVE ? '<div class="card live-c"><button type="button" class="live-t" data-m="stageopen" aria-label="Ver a imagem que o Mestre está mostrando">' + imgTag('mesa', LIVE.path, '') + '</button><div class="live-x"><p class="stage-l">' + EYE + 'Na mesa agora</p><p class="live-cap">' + esc(LIVE.caption || 'Imagem da mesa') + '</p>' +
      (memHasShow(LIVE.id) ? '<p class="sv good">Já está na sua memória.</p>' : '<button type="button" class="btn sm" data-m="memlive"' + (memBusy ? ' disabled' : '') + '>' + (memBusy ? 'Guardando…' : 'Memorizar') + '</button>') + '</div></div>' : '';
    const grid = items.length ? '<div class="mem-grid">' + items.map(function (m) {
      return '<button type="button" class="mem-c" data-m="open" data-id="' + m.id + '"><span class="mem-i">' + imgTag('players', m.path, '') + '</span><span class="mem-t">' + esc(m.cap || 'Sem título') + '</span>' + (m.note ? '<span class="mem-n">' + esc(m.note) + '</span>' : '') + '</button>';
    }).join('') + '</div>' : '<div class="card"><p class="muted">Quando o Mestre mostrar uma imagem, toque em Memorizar e ela fica guardada aqui, com espaço para anotar. Dá para guardar fotos suas também.</p></div>';
    const past = (SHOWS || []).filter(function (s) { return !memHasShow(s.id); });
    const hist = SHOWS === null ? '' : '<section class="grp"><h3 class="grp-h">Mostradas nesta mesa <span class="ct">' + past.length + '</span></h3>' +
      (!(SHOWS || []).length ? '<p class="hint-s">O Mestre ainda não mostrou imagens para você nesta mesa.</p>' : (!past.length ? '<p class="hint-s">Todas as imagens mostradas já estão na sua memória.</p>' : '<div class="mem-grid">' + past.map(function (s) {
        return '<div class="mem-c"><button type="button" class="mem-i" data-m="viewshow" data-id="' + s.id + '" aria-label="Ver ' + esc(s.caption || 'imagem') + '">' + imgTag('mesa', s.path, '') + '</button><span class="mem-t">' + esc(s.caption || 'Imagem da mesa') + '</span><button type="button" class="rb" data-m="memshow" data-id="' + s.id + '"' + (memBusy ? ' disabled' : '') + '>Memorizar</button></div>';
      }).join('') + '</div>')) + '</section>';
    box.innerHTML = '<div class="row between"><h2>Memória</h2><label class="btn q sm file-btn">' + IK.plus + 'Guardar uma imagem<input type="file" id="memfile" accept="image/*"></label></div>' +
      '<p class="sv" id="memsv" role="status">' + esc(memSv) + '</p>' + live + grid + hist;
    hydrate(box);
  }
  function memClick(el) {
    const m = el.dataset.m, id = el.dataset.id || '';
    if (m === 'stageclose') { stageClose(); return; }
    if (m === 'stageopen') { if (LIVE) { liveSeen = ''; stageShow(); } return; }
    if (m === 'memlive') { memorizeShow(LIVE); return; }
    if (m === 'memshow') { memorizeShow((SHOWS || []).filter(function (x) { return x.id === id; })[0] || (LIVE && LIVE.id === id ? LIVE : null)); return; }
    if (m === 'viewshow') { showView(id); return; }
    if (m === 'open') { memDelArm = ''; memView(id); return; }
    if (m === 'close') { memOpenId = ''; dlgClose(); return; }
    if (m === 'del') { if (memDelArm !== id) { memDelArm = id; memView(id); return; } memDelete(id); }
  }
  function memInput(t) {
    const id = t.dataset.mnote || t.dataset.mcap, m = MEM && MEM.items.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    if (t.dataset.mnote) m.note = t.value.slice(0, 2000); else m.cap = t.value.slice(0, 80);
    memSaveSoon();
  }

  /* ---------- perfil ---------- */
  function profile(msg, ok) {
    const el = $('#dlg'), u = me();
    el.hidden = false;
    el.innerHTML = '<div class="card"><h2>Perfil</h2><p class="muted">' + esc(u.email) + '</p><form class="stack" id="pro" style="width:100%" autocomplete="off">' +
      '<div class="field"><label for="p0">Senha atual</label><input type="password" id="p0" autocomplete="current-password" required></div>' +
      '<div class="field"><label for="p1">Nova senha (mínimo 8 caracteres)</label><input type="password" id="p1" autocomplete="new-password" minlength="8" required></div>' +
      '<div class="field"><label for="p2">Repita a nova senha</label><input type="password" id="p2" autocomplete="new-password" minlength="8" required></div>' +
      '<p class="err' + (ok ? ' ok' : '') + '" role="alert">' + esc(msg || '') + '</p><button class="btn" type="submit" id="pgo">Trocar senha</button></form><button type="button" class="skip" data-a="pclose">Fechar</button></div>';
  }
  async function profileSubmit() {
    const c = $('#p0').value, n1 = $('#p1').value, n2 = $('#p2').value, u = me();
    if (n1 !== n2) { profile('As senhas novas não são iguais.'); return; }
    if (n1.length < 8) { profile('Use pelo menos 8 caracteres.'); return; }
    $('#pgo').disabled = true;
    try {
      const r = await fetch(SB + '/auth/v1/token?grant_type=password', { method: 'POST', headers: Object.assign({ apikey: KEY }, JSONH), body: JSON.stringify({ email: u.email, password: c }) });
      if (!r.ok) { profile('A senha atual não confere.'); return; }
      const sess = store(await r.json());
      const p = await fetch(SB + '/auth/v1/user', { method: 'PUT', headers: Object.assign({ apikey: KEY, Authorization: 'Bearer ' + sess.access_token }, JSONH), body: JSON.stringify({ password: n1 }) });
      if (!p.ok) { const j = await p.json().catch(function () { return {}; }); profile(j.msg || j.message || 'Não consegui trocar a senha.'); return; }
      profile('Senha trocada.', true);
    } catch (e) { profile('Sem conexão. Tente de novo.'); }
  }

  /* ---------- início ---------- */
  async function start() {
    if (!me()) { if (EMBED) { app.innerHTML = '<div class="center"><p class="muted">Entre na Nuvem do Hollow Table para ver as fichas.</p></div>'; return; } drawLogin(); return; }
    camps = null; cur = null; loadErr = ''; drawCamps();
    try {
      const r = await api('/rest/v1/campaigns?select=id,name,system,owner,adv_id,members(user_id,name)&order=created_at.desc');
      if (!r.ok) throw new Error('x');
      camps = await r.json();
      if (EMBED) {
        cur = camps.filter(function (c) { return c.adv_id === EMBED_ADV && c.owner === me().id; })[0] || null;
        if (!cur) { app.innerHTML = '<div class="center"><p class="muted">Esta aventura ainda não tem mesa online. Crie no menu, em Jogadores.</p></div>'; return; }
        if (embPick) shView = embPick;
        tab = embTab; drawLobby(); return;
      }
      if (camps.length === 1) { cur = camps[0]; drawLobby(); } else drawCamps();
    } catch (e) {
      if (!me()) { drawLogin('Sua sessão expirou. Entre de novo.'); return; }
      loadErr = 'Não consegui carregar as suas mesas.'; drawCamps();
    }
  }

  document.addEventListener('submit', function (e) {
    if (e.target.id === 'itf') { e.preventDefault(); itSave(); return; }
    if (e.target.id === 'login') { e.preventDefault(); doLogin(); }
    if (e.target.id === 'pro') { e.preventDefault(); profileSubmit(); }
  });
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'catq' && addSt) { addSt.q = t.value; const l = $('#catl'); if (l) { l.innerHTML = catList(); l.scrollTop = 0; } return; }
    if (t.id === 'gn' && gSt) { gSt.n = t.value; return; }
    if (t.id === 'cn' && cSt) { cSt.n = t.value; return; }
    if (t.dataset && (t.dataset.mnote || t.dataset.mcap)) { memInput(t); return; }
    if (t.dataset && t.dataset.k && SH) { shInput(t); return; }
    if (t.id === 'lbl') dice.label = t.value;
    else if (t.id === 'expr') dice.expr = t.value;
    else if (t.id === 'nh') dice.nh = Math.max(1, Math.min(40, parseInt(t.value, 10) || 10));
    else if (t.id === 'nt' || t.id === 'nx') { const n = curNote(); if (n) { if (t.id === 'nt') n.title = t.value; else n.text = t.value; n.at = Date.now(); saveSoon(); if (t.id === 'nt') { const b = document.querySelector('.nitem[aria-current="true"]'); if (b) b.textContent = t.value || 'Sem título'; } } }
  });
  document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.dataset && t.dataset.f === 'kind' && $('#itf')) { kindChange(t); return; }
    if (t.id === 'memfile' && t.files && t.files[0]) { memUpload(t.files[0]); t.value = ''; return; }
    if (t.id === 'priv') dice.priv = t.checked;
    else if (t.dataset && t.dataset.chk && SH) { sysData()[t.dataset.chk] = t.checked; saveSheetSoon(); }
    else if (t.dataset && t.dataset.rr && SH) paintSheet();
    else if (t.id === 'photo' && t.files && t.files[0]) { uploadPhoto(t.files[0]).catch(function () { shSv = 'Não consegui usar esta imagem.'; paintSv(); }); t.value = ''; }
  });
  document.addEventListener('focusout', function (e) {
    if (!shStale || !e.target.closest || !e.target.closest('#sheet')) return;
    setTimeout(function () { if (!shStale || shEditing()) return; const ch = shStale; shStale = null; paintSheet(); shFlash(ch); }, 0);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'expr') { e.preventDefault(); doRoll(rollExpr(dice.expr)); } if (e.key === 'Escape') { if (histIsOpen()) { histClose(); const b = $('#hbtn'); if (b) b.focus(); } else if (!$('#dlg').hidden) dlgClose(); else if ($('#stage') && !$('#stage').hidden) stageClose(); } });
  /* presença: volta na hora ao reabrir o app; ao fechar, avisa a saída */
  document.addEventListener('visibilitychange', function () { if (!document.hidden && partyT) ping(); });
  window.addEventListener('pagehide', function () { if (partyT) pingBye(partyCid); });
  window.addEventListener('pageshow', function (e) { if (e.persisted && partyT) ping(); });
  window.addEventListener('resize', function () { histPlace(); });
  document.addEventListener('click', function (e) {
    const ts = e.target.closest('.tst');
    if (ts) { tstOut(ts); return; }
    if (histIsOpen() && !e.target.closest('#hist') && !e.target.closest('#hbtn')) histClose();
    const el = e.target.closest('[data-b],[data-m],[data-a],[data-die],[data-st],[data-adv],[data-tab],[data-camp],[data-note],[data-pip],[data-tog],[data-cyc],[data-add],[data-del],[data-roll],[data-pv],[data-pf]');
    if (!el || el.disabled) return;
    if (el.dataset.b) { bagClick(el); return; }
    if (el.dataset.m) { memClick(el); return; }
    if (el.dataset.pv) { shView = el.dataset.pv; drawPane(); return; }
    if (el.dataset.pf) {
      if (isOwner()) { shView = el.dataset.pf; setTab('fichas'); }
      else if (el.dataset.pf === me().id) setTab('ficha');
      const p = $('#pane'); if (p) p.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    if (SH && !el.disabled && shClick(el)) return;
    if (el.dataset.die) { doRoll(rollSimple(parseInt(el.dataset.die, 10))); return; }
    if (el.dataset.st) {
      const k = el.dataset.st, d = parseInt(el.dataset.d, 10);
      if (k === 'qty') dice.qty = Math.max(1, Math.min(20, dice.qty + d)); else dice.mod = Math.max(-30, Math.min(30, dice.mod + d));
      $('#o-qty').textContent = dice.qty; $('#o-mod').textContent = (dice.mod > 0 ? '+' : '') + dice.mod;
      return;
    }
    if (el.dataset.adv != null) { dice.adv = parseInt(el.dataset.adv, 10); document.querySelectorAll('[data-adv]').forEach(function (b) { b.setAttribute('aria-pressed', String(parseInt(b.dataset.adv, 10) === dice.adv)); }); return; }
    if (el.dataset.tab) { tab = el.dataset.tab; document.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); }); drawPane(); return; }
    if (el.dataset.camp) { cur = camps.filter(function (c) { return c.id === el.dataset.camp; })[0]; tab = 'dados'; last = null; drawLobby(); return; }
    if (el.dataset.note) { noteId = el.dataset.note; noteDelArm = false; paintNotes(); return; }
    const a = el.dataset.a;
    if (a === 'duality') doRoll(rollDuality());
    else if (a === 'gurps') doRoll(rollGurps());
    else if (a === 'expr') doRoll(rollExpr(dice.expr));
    else if (a === 'hist') { if (histIsOpen()) histClose(); else histOpen(); }
    else if (a === 'histx') { histClose(); const b = $('#hbtn'); if (b) b.focus(); }
    else if (a === 'lobby') { cur = null; drawCamps(); }
    else if (a === 'retry') start();
    else if (a === 'profile') profile();
    else if (a === 'pclose') dlgClose();
    else if (a === 'out') { partyStop(); evStop(); try { localStorage.removeItem('cdm-sb'); } catch (x) { /* ok */ } stopBag(); stopStage(); camps = null; cur = null; drawLogin(); }
    else if (a === 'nnew') { const n = { id: Date.now().toString(36), title: 'Nova nota', text: '', at: Date.now() }; notes.notes.unshift(n); noteId = n.id; noteDelArm = false; paintNotes(); saveSoon(); const f = $('#nt'); if (f) { f.focus(); f.select(); } }
    else if (a === 'ndel') { if (!noteDelArm) { noteDelArm = true; paintNotes(); return; } notes.notes = notes.notes.filter(function (n) { return n.id !== noteId; }); noteId = notes.notes[0] ? notes.notes[0].id : null; noteDelArm = false; paintNotes(); saveSoon(); }
  });
  start();
})();
</script>
</body>
</html>
