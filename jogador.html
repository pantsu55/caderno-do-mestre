<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3; url=jogar.html">
<title>Hollow Table · Jogador</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root { color-scheme: dark; --bg: #0A0912; --surface: #131122; --line: #2A2645; --fg: #E9E6F7; --muted: #9A95B8; --accent: #5EE1F5; --accent-ink: #031219; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.5 'Atkinson Hyperlegible', system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
main { width: min(420px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; }
img { width: 64px; height: 64px; border-radius: 14px; }
h1 { margin: 0; font: 600 22px Cinzel, Georgia, serif; letter-spacing: 0.04em; }
p { margin: 0; color: var(--muted); }
a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>Hollow Table</h1>
  <p>A sala por link não existe mais. Agora cada jogador entra na mesa com a própria conta.</p>
  <a href="jogar.html">Entrar na mesa</a>
</main>
<script>setTimeout(function () { location.replace('jogar.html'); }, 2500);</script>
</body>
</html>
