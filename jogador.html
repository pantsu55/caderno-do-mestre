<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<title>Hollow Table · Jogador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg: #0A0912; --surface: #131122; --line: #2A2645; --fg: #E9E6F7; --muted: #9A95B8; --accent: #5EE1F5; --accent-ink: #031219; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 17px/1.5 'Atkinson Hyperlegible', system-ui, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
main { min-height: 100%; display: flex; flex-direction: column; max-width: 960px; margin: 0 auto; }
h1 { font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: 0.04em; margin: 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
.bar small { color: var(--muted); font-size: 14px; }
.who { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; min-height: 36px; cursor: pointer; }
.center { flex: 1; display: grid; place-content: center; text-align: center; gap: 14px; padding: 24px 0; justify-items: center; }
.center p { margin: 0; color: var(--muted); max-width: 32ch; }
.moon { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0, #cfd6e8 40%, #7d87a6 100%); opacity: 0.85; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.45; } }
form.join { display: grid; gap: 12px; width: min(320px, 100%); }
input { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: inherit; padding: 12px 14px; min-height: 48px; text-align: center; letter-spacing: 0.2em; text-transform: uppercase; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; font: inherit; font-weight: 700; min-height: 48px; padding: 0 18px; cursor: pointer; }
.btn.q { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.names { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 420px; }
.stage { flex: 1; display: grid; place-items: center; min-height: 40vh; }
.stage figure { margin: 0; display: grid; gap: 12px; justify-items: center; animation: rise 0.7s ease both; }
@keyframes rise { from { opacity: 0; transform: scale(0.985); } }
.stage img { max-width: 100%; max-height: 72vh; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,0.6); cursor: zoom-in; }
.stage figcaption { font-family: 'Cinzel', serif; font-size: 20px; text-align: center; }
.hist { padding: 14px 0 20px; }
.hist h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.thumbs button { flex: none; width: 112px; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; color: var(--fg); }
.thumbs img { width: 100%; height: 72px; object-fit: cover; display: block; }
.thumbs span { display: block; font-size: 12px; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zoom { position: fixed; inset: 0; background: rgba(5,4,10,0.96); display: grid; place-items: center; z-index: 5; padding: 12px; cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }
@media (prefers-reduced-motion: reduce) { .moon, .stage figure { animation: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
(function () {
  'use strict';
  const URL_ = 'https://ksucnjrmcagzepxahync.supabase.co', KEY = 'sb_publishable_zg_rPvJ15I_wbaFZ2qemeg_Xnsalgsh';
  const app = document.getElementById('app');
  const esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  const ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ok */ } }
  };
  let code = (new URLSearchParams(location.search).get('sala') || ls.get('ht-sala') || '').trim().toUpperCase();
  let room = null, state = 'idle', raw = '', name = null, pick = false, view = null, lastCur = null, zoom = null, fails = 0;

  function visible(e) { return !e.to || e.to.indexOf('todos') >= 0 || (name && name !== '*' && e.to.indexOf(name) >= 0); }
  function draw() {
    if (!code) {
      app.innerHTML = '<div class="center"><div class="moon" aria-hidden="true"></div><h1>Hollow Table</h1><p>Digite o código da sala que o Mestre passou.</p>' +
        '<form class="join" id="join"><input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código da sala" placeholder="CÓDIGO"><button class="btn" type="submit">Entrar</button></form></div>';
      return;
    }
    if (state === 'idle') { app.innerHTML = '<div class="center"><div class="moon" aria-hidden="true"></div><p>Entrando na sala…</p></div>'; return; }
    if (state === 'gone') {
      app.innerHTML = '<div class="center"><h1>Sala não encontrada</h1><p>O código pode estar errado, ou o Mestre encerrou a sala.</p><button class="btn q" id="other" type="button">Usar outro código</button></div>';
      return;
    }
    const players = (room && room.players) || [];
    if ((name === null || pick) && players.length) {
      app.innerHTML = '<div class="center"><h1>Quem é você?</h1><p>Assim o Mestre pode mostrar algumas imagens só para você.</p><div class="names">' +
        players.map(function (p) { return '<button type="button" class="btn q" data-name="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') +
        '<button type="button" class="btn q" data-name="*">Só assistir</button></div></div>';
      return;
    }
    const shown = ((room && room.shown) || []).filter(visible);
    const curE = shown.filter(function (e) { return e.id === (view || (room && room.cur)); })[0];
    const hist = shown.filter(function (e) { return !curE || e.id !== curE.id; }).reverse();
    let stage;
    if (curE) stage = '<figure><img id="big" src="' + esc(curE.url) + '" alt="' + esc(curE.cap || '') + '"><figcaption>' + esc(curE.cap || '') + '</figcaption></figure>';
    else stage = '<div class="center"><div class="moon" aria-hidden="true"></div><p>Aguardando o Mestre…</p></div>';
    app.innerHTML = '<div class="bar"><div><h1>' + esc((room && room.title) || 'Hollow Table') + '</h1><small>Sala ' + esc(code) + (name && name !== '*' ? ' · ' + esc(name) : '') + '</small></div>' +
      (players.length ? '<button type="button" class="who" id="who">Trocar jogador</button>' : '') + '</div>' +
      '<div class="stage">' + stage + '</div>' +
      (hist.length ? '<section class="hist"><h2>Já reveladas</h2><div class="thumbs">' + hist.map(function (e) { return '<button type="button" data-view="' + esc(e.id) + '"><img src="' + esc(e.url) + '" alt=""><span>' + esc(e.cap || 'Imagem') + '</span></button>'; }).join('') + '</div></section>' : '');
    if (zoom) app.insertAdjacentHTML('beforeend', '<div class="zoom" id="zoom"><img src="' + esc(zoom) + '" alt=""></div>');
  }
  async function poll() {
    if (!code) return;
    let next = 2500;
    try {
      const r = await fetch(URL_ + '/rest/v1/rpc/get_room', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ c: code }) });
      if (!r.ok) throw new Error('http');
      const j = await r.json();
      fails = 0;
      if (j === null) { if (state !== 'gone') { state = 'gone'; room = null; draw(); } }
      else {
        const s = JSON.stringify(j);
        if (s !== raw || state !== 'ok') {
          raw = s; room = j; state = 'ok';
          if (j.cur !== lastCur) { lastCur = j.cur; view = null; zoom = null; }
          draw();
        }
      }
    } catch (e) { fails++; next = Math.min(15000, 2500 * (fails + 1)); }
    setTimeout(poll, document.hidden ? Math.max(next, 8000) : next);
  }
  function enter(c) {
    code = c.trim().toUpperCase();
    if (!code) return;
    ls.set('ht-sala', code);
    name = ls.get('ht-pl-' + code);
    state = 'idle'; raw = ''; draw(); poll();
  }
  document.addEventListener('submit', function (e) { if (e.target.id === 'join') { e.preventDefault(); enter(document.getElementById('code').value); } });
  document.addEventListener('click', function (e) {
    const t = e.target.closest('button, #big, #zoom');
    if (!t) return;
    if (t.getAttribute && t.getAttribute('data-name') != null) { name = t.getAttribute('data-name'); ls.set('ht-pl-' + code, name); pick = false; draw(); return; }
    if (t.id === 'who') { pick = true; draw(); return; }
    if (t.id === 'other') { code = ''; ls.set('ht-sala', ''); state = 'idle'; draw(); return; }
    if (t.getAttribute && t.getAttribute('data-view')) { view = t.getAttribute('data-view'); draw(); window.scrollTo(0, 0); return; }
    if (t.id === 'big') { zoom = t.getAttribute('src'); draw(); return; }
    if (t.id === 'zoom') { zoom = null; draw(); }
  });
  if (code) { name = ls.get('ht-pl-' + code); draw(); poll(); } else draw();
})();
</script>
</body>
</html>
